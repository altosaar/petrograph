[package]
name = "petrograph"

# The generated SDK lands in tools/, beside the scripts that import it — every tool
# here runs from anywhere via `uv run --script`, and `baml_sdk` has to be importable
# the same way `_hunks.py` is.
[generator.client1]
output_type = "python/pydantic"
output_dir = "tools"
naming_convention = "preserve-case"

# [scripts]
# dev = "-f main"

# Add a client generator, then generate its SDK:
#   baml generate add python/pydantic2
#   baml generate
#
# Run `baml generate add --help` to see every supported output type.
