# providers.example.conf — copy to providers.conf and edit.
#
#     cp providers.example.conf providers.conf
#
# providers.conf is gitignored, because it holds the paths of your private repositories.
# This file is the tracked copy, and should stay free of anything personal.
#
# A provider is a command that writes one markdown file. `just weekly` runs each of them,
# then points this week's `attachments:` at whatever they produced. petrograph never learns
# what is in the files — `weekly_review.py` inlines them into the bundle as markdown, and a
# ledger, a sleep report and a browsing summary are all the same thing to it.
#
# Three keys per section:
#   command   run through the shell, from the repository root
#   out       where it will write; optional, defaults to context/<name>-<date>.md
#   role      `attachment` (the default) or `diff`; see [microlite] below
#
# Five placeholders, substituted in both `command` and `out`:
#   {days}     the review window
#   {date}     today, as YYYY-MM-DD
#   {year}     today's year
#   {session}  this session's own directory, sessions/<date>
#   {out}      the `out` path of the same section
#
# Pointing `out` at {session} is what makes a session self-contained — the diff, the ledger
# and the sleep report land in one folder beside the file you fill in, which is the folder you
# paste from. sessions/ is gitignored whole, so nothing there is committable. Point `out` at
# the owning repository instead if you would rather the copy never leave it; either works, and
# `attachments:` is wired to wherever it lands. Providers authenticate with their own
# credentials in their own working directory, so no token has to be reachable from here.
#
# A provider that fails costs you its attachment, not the review: the others still run, the
# session is still written, and the failure is reported at the end. Comment out a section to
# turn it off for a while; delete it when you mean it.

# ── the week's Obsidian vault history ────────────────────────────────────────
# The spine of the read: what you actually wrote this week, as diffs. `role = diff` sends
# it to the session's `diff:` key instead of `attachments:`, because the bundle gives it a
# section of its own and `--resume` reads it back out of the session. At most one
# provider may claim that role.
#
# Listing it here rather than leaving it inside weekly_review.py is what makes it the same
# kind of thing as everything else — `--only microlite` and `--skip microlite` work on it
# like they work on the rest, and you can read the diff before deciding to pay for a read
# of it. Left out or failing, weekly_review.py just builds the diff itself when it runs.
[microlite]
command = ./tools/microlite_hunks.py --days {days} --out {out}
out     = {session}/microlite.md
role    = diff

# ── the week's spending, as categorized Beancount ────────────────────────────
# Private repo, private output. `--sync` refreshes the source before reading it, which is
# what keeps the window this reports and the window that was actually fetched the same
# window. Without it a provider reads whatever the last manual refresh left on disk, and a
# source last synced before the week even began writes a correct, empty, entirely
# believable document about a week in which nothing happened.
#
# Worth copying the shape even if you have no ledger: a provider that can refresh itself
# should, and one that cannot should date what it wrote. petrograph is domain-blind by
# design — it can tell you an attachment came back hollow, but only the provider knows
# whether that is a quiet week or a stale source, so only the provider can say which.
#
# A sync that fails costs you the freshness, not the attachment: that script falls back to
# the data on disk and labels the document with how old it is.
[finances]
command = ~/projects/your-ledger/scripts/weekly-context.sh --days {days} --sync --out {out}
out     = {session}/finances-{date}.md

# ── the week's sleep and physiology ──────────────────────────────────────────
# The CLI runs the obsidian-oura-metrics plugin's own code from the vendor/ submodule
# through tsx, fetched by npx on first run — nothing to build.
# Oura is OAuth-only now, and the CLI runs no flow of its own: it borrows the access token
# the plugin stored when you clicked Connect, from the plugin's data.json in ~/notes (or
# $OBSIDIAN_VAULT), or takes $OURA_TOKEN. Never here. The grant lasts ~30 days with no
# refresh; when it lapses this provider fails saying so, and Reconnect in Obsidian fixes it.
#
# {days} is the window it prints day by day; it fetches three further weeks behind that
# and reports the week against them — mean, SD, and the change in baseline SDs, plus the
# single days that sit outside ±1.5 SD of those weeks. A window that is its own baseline
# cannot see a bad week: seven short nights all look ordinary next to each other. Append
# `--baseline-weeks N` to widen or narrow that comparison period; 0 turns it off.
[oura]
command = ./tools/oura_metrics.ts --days {days} --out {out}
out     = {session}/oura-{date}.md

# ── where the week went online ───────────────────────────────────────────────
# Local, read-only, no network. Quit the browser first if you want the last hour: the history
# is read lock-free, which means anything still in its write-ahead log is invisible.
# Skip it for a week you would rather not have in the read: `just weekly --skip browsing`.
[browsing]
command = ./tools/browsing_history.py --browser firefox --days {days} --out {out}
out     = {session}/browsing-firefox-{date}-{days}d.md

# Chrome instead, or as well — give it its own section name so both can run.
# [browsing-chrome]
# command = ./tools/browsing_history.py --browser chrome --days {days} --out {out}
# out     = {session}/browsing-chrome-{date}-{days}d.md

# Safari records no time on page, so its document leaves those columns out.
# [browsing-safari]
# command = ./tools/browsing_history.py --browser safari --days {days} --out {out}
# out     = {session}/browsing-safari-{date}-{days}d.md

# ── who you talked to ────────────────────────────────────────────────────────
# Reads the message databases in place, through the immutable URI. messages/ is gitignored.
# [contacts]
# command = ./tools/extract_contacts.py --months 1 --out {out}
# out     = {session}/contacts-{date}-1mo.json
