": 0, "text": " **10-30** — watched sigrid's interview on tobias's monitor. four minutes about him, and at the end she cries, properly, on camera, for a man who signed her pay slips. i have not cried once. what is he to her, that she can do that in four minutes and i cannot do it in eleven months.\n \n tobias is cutting the middle from yorick's old tapes. there is one of yorick rehearsing dad's launch speech in dad's voice, and for about three seconds i thought it was dad. [[yorick-comms-quotes]]\n+\n+**11-02** — sent tobias the file at 09:50. told him: archive from the building, 02:11 timestamp, use it under the middle. he did not ask what it was of.\n+\n+cut locked 16:12 monday. claudius moved the screening forward to the offsite on **thursday 11-05**, ninth floor, 16:40, because \"the board are all in the room anyway.\"\n+\n+he moved it forward himself. i want that written down somewhere that is not my memory.", "kind": "added", "chars": 405, "id": "11-06/18", "ord": 18, "week": "11-06", "squares": 2}, {"note": "journal.md", "head": "@@ -1,4 +1,22 @@", "add": 18, "dele": 0, "text": " # journal\n+\n+**11-06** — writing this at two in the morning on 11-06, so it is friday, so it has been about thirty hours.\n+\n+the screening was 16:40 on the ninth floor. the archive section runs at 06:20 into the cut. i watched claudius rather than the screen. he was fine for nine seconds. at the tenth he put his glass down on the table beside him without looking at where the table was, and then at 16:47 he stood up and went out through the back and the lights were still down. osric went after him about four seconds later, which tells you osric's job.\n+\n+i was calm. that is the part i keep coming back to and it is not the part i expected to keep coming back to. not triumphant, not frightened. calm, the way you are calm when a long arithmetic finally comes out.\n+\n+then mum's office at about half five, and i said the things i have been saving since the wedding, and they came out worse than i had them saved. i said \"you married the man who was on the roof\" which i cannot prove and should not have said in that order. she said my father's name twice and i talked over her both times.\n+\n+polonius was in the room next door with the door open enough. i heard the chair. i went out into the corridor and he was already at the rail and then he was not, and i have gone over the four seconds between those two facts about two hundred times and i still cannot put anything in the middle of them.\n+\n+18:05. the duty log will say 18:05 because francisco logged the alarm.\n+\n+i did not mean it. i am also not sorry in the way a person is supposed to be sorry. both of those are true at once and i cannot put either of them down because admitting one looks like lying about the other.\n+\n+by this evening it is being handled as an accident. that is the second time this company has used that word about a man going off a high thing, and i appear to be the only person in the building who has counted.\n+\n+**11-02** — gave tobias the file. told him it was archive from the building, 02:11 timestamp, use it under the middle section. he did not ask what it was of. crews do not, apparently. cut locked at 16:12 on monday.\n \n **10-31** — saturday. had the phone in my hand to ring ophelia and put it down again.", "kind": "added", "chars": 2072, "id": "11-06/19", "ord": 19, "week": "11-06", "squares": 10}, {"note": "stairwell-nine-timeline.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# stairwell nine — timeline\n\nmade from the duty log and the running order, not from memory, because my memory of thursday is four seconds long and the middle of it is missing.\n\n- 16:40 film starts, ninth floor\n- 16:47 claudius leaves through the back. lights still down. osric follows at about 16:47\n- 17:12 drinks set up, most of the room moves along the corridor\n- 17:25 past claudius's office on the way along. door open, lights off, him at the desk. did not go in\n- 17:30 mum's office. door shut. polonius in the room adjoining, door ajar — i did not know that at 17:30, i knew it at 18:04\n- 18:04 i hear the chair\n- 18:05 francisco logs the alarm on nine\n\nwhat is not in this list is anything between 18:04 and 18:05, and that is the part people will ask about, and i do not have it.", "id": "11-06/20", "ord": 20, "week": "11-06", "squares": 1}, {"note": "who-asked-what-when.md", "head": "@@ -12,4 +12,9 @@ # who asked what, when", "add": 6, "dele": 1, "text": " \n eleven minutes and two floors from being oblique in a meeting to rosencrantz asking horatio a question about my sleep.\n \n-nobody has asked me anything.\n+nobody has asked me anything directly. seven weeks.\n+\n+| 11-03 | rosencrantz | me | whether there is archive in the film |\n+| 11-04 | osric | tobias | the running order, four times |\n+\n+r asked it in the voice of a man reading the second line of a script.", "kind": "mixed", "chars": 274, "id": "11-06/21", "ord": 21, "week": "11-06", "squares": 1}, {"note": "fencing-gothersgade-tuesdays.md", "head": "@@ -6,8 +6,12 @@ # fencing — gothersgade, tuesdays", "add": 5, "dele": 1, "text": " \n **10-20** — tuesday. went. footwork for an hour, then bouts with karin, who does not ask questions and does not miss a parry. shoulder held.\n \n-this is the only hour in the week where i am not doing the other thing.\n+this is the only hour in the week where i am not doing the other thing. was.\n \n **10-27** — went. fenced badly and on purpose, in the same way i was late on purpose, which i did not realise until karin said \"youre not here\" between bouts and i said no, fair.\n \n **10-29** — did not go. tobias at two, then stood in a corridor for four seconds and decided something, then went home.\n+\n+**11-03** — went. best hour of the month by a long way.\n+\n+**11-05** — the offsite. no.", "kind": "mixed", "chars": 230, "id": "11-06/22", "ord": 22, "week": "11-06", "squares": 1}, {"note": "ines-abril-emails.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# ines abril — emails\n\nfreelance. has been writing about the company since before the inquest. six emails since the autumn, all of them polite, none of them answered.\n\nshe has been following up with marcellus and bernardo, which means she knows there is a roof in this, which means reynaldo has heard, which means polonius has.\n\n**10-30** — three more, thursday and friday. guildenstern has talked to her; i can tell because two of her questions are phrased in his order.\n\nnot answering. not because there is nothing there but because i am not the person who gets to tell it yet.", "id": "11-06/23", "ord": 23, "week": "11-06", "squares": 1}, {"note": "roof-footage-0211.md", "head": "@@ -21,3 +21,9 @@ # roof footage — 02:11", "add": 6, "dele": 0, "text": " not telling horatio until it is cut. he will say the right thing about it and i do not want to hear the right thing yet. #film\n \n **10-31** — a shoulder is not a face. i have built three weeks on thirteen seconds of somebody's coat, and a coat could be anybody's. before i do anything that cannot be undone i want better than the coat. i want to see his face when he sees it.\n+\n+**11-02** — handed it over at 09:50. told tobias it was archive from the building with an 02:11 timestamp, use it under the middle. he did not ask what it was of. cut locked 16:12.\n+\n+**11-05** — it played at 06:20 into the cut, so 16:46 by the clock. claudius was fine for nine seconds. at the tenth he put his glass down without looking for the table. out through the back at 16:47 with the lights still down.\n+\n+so now two people in this building know what is on it and one of them is the person i needed to find out about.", "kind": "added", "chars": 518, "id": "11-06/24", "ord": 24, "week": "11-06", "squares": 3}, {"note": "yorick-comms-quotes.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# yorick — still quoted\n\nhead of comms for nineteen years, dead eleven.\n\nhe used to let me sit under the desk during the quarterly. i was seven. he did the voices.", "id": "11-06/25", "ord": 25, "week": "11-06", "squares": 1}, {"note": "nordhavn-lease-petra-lund.md", "head": "@@ -16,3 +16,7 @@ # nordhavn lease — petra lund", "add": 4, "dele": 0, "text": " reynaldo does not do references. reynaldo does this. #reynaldo\n \n still have not answered her about the lease. sixteen days.\n+\n+**11-06** — nine days. have not answered her.\n+\n+she put a second note under the door on thursday while i was at the offsite. it says \"whenever youre ready\" which is worse than a deadline.", "kind": "added", "chars": 184, "id": "11-06/26", "ord": 26, "week": "11-06", "squares": 1}, {"note": "voltemand-norvik-billing.md", "head": "@@ -2,10 +2,14 @@ # voltemand — norvik, billing", "add": 5, "dele": 1, "text": " \n outside counsel. cornelius is in-house. when i was a child i thought they were the same firm.\n \n-**10-28** — three trips to norvik since the new year: 09-30, 10-14, 10-28. osric says the car service booking did not come from corp dev either time. \"not us.\"\n+**10-28** — four trips to norvik since the new year: 09-30, 10-14, 10-28, 11-03. osric says the car service booking did not come from corp dev either time. \"not us.\"\n \n asked voltemand directly on 10-29. 09-30 was \"a client meeting\", no further detail. 10-28 he deferred — \"depends on probate timing\", which is not an answer to a question about norvik.\n \n cornelius, when i mentioned it: \"hes not billing us for those days.\" which is the actual problem. #norvik\n \n **10-30** — voltemand reported back to the board on norvik. claudius sent him in january to get fortinbras to stop picking off our suppliers, and the news is that fortinbras will stand off, and would in return like \"data-room access for a possible partnership\". the board said yes in eleven minutes. nobody asked what a competitor wants with our supplier pricing.\n+\n+**11-04** — checked the portal. voltemand's last invoice to the estate is dated 10-23. nothing since, and he has been to norvik twice since.\n+\n+so either he is doing work we are not paying for, or he is doing work for somebody else and using our car service to get there.", "kind": "mixed", "chars": 591, "id": "11-06/27", "ord": 27, "week": "11-06", "squares": 3}, {"note": "nyholm-appointment.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# nyholm\n\ngp. first saw her three months ago about the sleep. she wrote things down and gave me a name i did not call.\n\n**10-23** — rang the surgery. next appointment is 11-18, 09:30. took it. 11-18.\n\ndid not say anything about that on the phone. the receptionist was reading from a screen.\n\n**11-06** — still 11-18 at 09:30. have tried to cancel it twice this week and both times put the phone down before it rang, which i suppose is the answer.\n\nthings to actually say, because i will not say them otherwise:\n- awake at three, most nights, and the ring says seven hours\n- stopped eating without noticing\n- flat underneath the anger", "id": "11-06/28", "ord": 28, "week": "11-06", "squares": 1}], "notes": ["wittenberg-withdrawal-form.md", "offsite-running-order.md", "mum-drafts-unsent.md", "rosencrantz-guildenstern-review.md", "sleep-ring-score-log.md", "kronborg-roof-access-codes.md", "horatio-what-we-know.md", "polonius-chief-of-staff.md", "estate-account-probate.md", "inquest-bundle-gaps.md", "roskilde-house-empty.md", "ophelia-contact-log.md", "fencing-kit-dad-jacket.md", "marcellus-shift-logs.md", "claudius-chief-executive.md", "log.md", "anniversary-film-fen-co.md", "journal.md", "stairwell-nine-timeline.md", "who-asked-what-when.md", "fencing-gothersgade-tuesdays.md", "ines-abril-emails.md", "roof-footage-0211.md", "yorick-comms-quotes.md", "nordhavn-lease-petra-lund.md", "voltemand-norvik-billing.md", "nyholm-appointment.md"]}, {"week": "11-13", "weekday": "Friday", "hunks": [{"note": "fencing-kit-dad-jacket.md", "head": "@@ -8,4 +8,8 @@ # kit — dad's jacket", "add": 5, "dele": 1, "text": " \n **11-03** — took a hit on the left shoulder i should not have taken. the jacket moved and i did not. karin said \"youre wearing a tent\" and then did not make a joke out of it, which is why i like karin.\n \n-the hall rents a jacket for 40. i have not rented the jacket for 40.\n+the hall rents a jacket for 40.\n+\n+**11-13** — if i am going on tuesday i am going in a jacket that fits. rent the hall's.\n+\n+that sentence took eleven months and it is about a coat. #kit", "kind": "mixed", "chars": 247, "id": "11-13/0", "ord": 0, "week": "11-13", "squares": 1}, {"note": "polonius-chief-of-staff.md", "head": "@@ -6,8 +6,6 @@ # polonius — chief of staff", "add": 0, "dele": 2, "text": " \n **10-28** — he has decided the problem is ophelia, and has told at least three people so, because reynaldo is asking my landlord what hours i keep and reynaldo only moves when polonius points him.\n \n-the theory is tidy and it is wrong and it is easier than the true one, which is why it won.\n-\n he sent accommodation and dietary requirements for an offsite that is in one room for one afternoon.\n \n **10-30** — he has a message i sent ophelia in december, and he has shown it to claudius. i know because claudius quoted it back to me in the lift this morning, smiling — \"doubt everything else, never doubt that\" — which i wrote at two in the morning and would not have shown my own mother. [[ophelia-contact-log]]", "kind": "removed", "chars": 91, "id": "11-13/1", "ord": 1, "week": "11-13", "squares": 1}, {"note": "kronborg-roof-access-codes.md", "head": "@@ -14,10 +14,6 @@ # kronborg — roof access, codes", "add": 0, "dele": 4, "text": " \n polonius signed off the install. claudius was not chief executive yet but he was in the building most days. sigrid would know who asked for the lock and why — she was still in the office then. #access\n \n-**10-28** — asked sigrid. she says the lock request came through polonius's office six months before he died and the justification on the form was \"insurance\". she typed the covering note herself. she does not remember anyone asking for the roof to be locked before that and she was there nineteen years.\n-\n-so: a door nobody used gets a lock five months before somebody goes off it.\n-\n **11-04** — cornelius says the access log for 11-18 is not in the bundle. it was never requested, because the death was not treated as one where access mattered.\n \n it still exists. it is on the panel, not on paper, and the panel keeps twenty-four months. which gives me twenty-four months from that night and then it does not exist any more. [[inquest-bundle-gaps]]", "kind": "removed", "chars": 379, "id": "11-13/2", "ord": 2, "week": "11-13", "squares": 2}, {"note": "roskilde-house-empty.md", "head": "@@ -5,3 +5,11 @@ # roskilde — the house", "add": 8, "dele": 0, "text": " cannot be in it for more than an hour. five attempts now and the longest was fifty minutes.\n \n **10-17** — an hour, then left. the fencing kit is in the upstairs hall closet. the plot at the churchyard is 380 a quarter out of the estate account and somebody mows it and i have never met them.\n+\n+**11-07** — drove out on saturday, sat in the car in the lane for about twenty minutes, did not go in, drove back. that is the fifth time and the first time i have written it down honestly.\n+\n+**11-12** — the water below the house. that is where they found her.\n+\n+i am not going to be able to go back there now and i am going to have to go back there on monday.\n+\n+**11-13** — the man who mows dad's plot rang. first time i have heard his voice in a year of paying him. he is digging on saturday for monday, at the water end, and wanted to know whether the family minded the old hedge coming out. i said i was not family. he said \"youre the son\", and then that he has done that churchyard since the year i was born, and that yorick is three rows over from dad — \"the comms man, used to do the voices at the harvest supper.\"", "kind": "added", "chars": 812, "id": "11-13/3", "ord": 3, "week": "11-13", "squares": 4}, {"note": "voltemand-norvik-billing.md", "head": "@@ -13,3 +13,11 @@ # voltemand — norvik, billing", "add": 8, "dele": 0, "text": " **11-04** — checked the portal. voltemand's last invoice to the estate is dated 10-23. nothing since, and he has been to norvik twice since.\n \n so either he is doing work we are not paying for, or he is doing work for somebody else and using our car service to get there.\n+\n+**11-10** — read his instructions in the lisbon shared file, in lisbon, twice.\n+\n+two pages. my name is in the second paragraph of both. the second page is about what is to happen to my access if the review \"identifies a governance concern\", and it is dated 11-06, which is the day after the screening.\n+\n+he has been to norvik three times and billed us nothing and written two pages about me, and cornelius is the one who noticed the billing first. take the records timeline off voltemand and give it to cornelius. [[bispebjerg-records-request]]\n+\n+norvik closed two more of our suppliers on 11-10, and priced both out of the data room the board opened for them on 10-30 on voltemand's word.", "kind": "added", "chars": 680, "id": "11-13/4", "ord": 4, "week": "11-13", "squares": 3}, {"note": "yorick-comms-quotes.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# yorick — still quoted\n\nhead of comms for nineteen years, dead eleven.\n\nhe used to let me sit under the desk during the quarterly. i was seven. he did the voices.\n\n**11-13** — buried at roskilde, three rows over from dad. the man who mows the plot told me on the phone. i have paid for that churchyard every quarter by standing order and never once walked three rows. [[roskilde-house-empty]]", "id": "11-13/5", "ord": 5, "week": "11-13", "squares": 1}, {"note": "lisbon-booking-voltemand-file.md", "head": "@@ -1 +1,15 @@", "add": 14, "dele": 0, "text": " # lisbon — booking, and what was in the file\n+\n+**11-08** — itinerary from osric at 17:14 on a sunday. a fortnight, not the four days i was told. hotel to 11-20. rosencrantz and guildenstern on the same booking reference.\n+\n+claudius framed it as the norvik integration work. laertes is already down there. mum said, on the phone before all this, that it would \"do me good to be out of the building\", which is the kind of thing somebody says when they have been given the sentence to say.\n+\n+**11-10** — the shared file has voltemand's instructions in it. i do not think anybody meant me to have the folder, i think somebody shared the parent.\n+\n+read it twice. the second time with the board minutes from the month he died open beside it, and that is when you can see the shape: the resolution dated the 18th, the announcement on the 17th. he does it the same way every time.\n+\n+then i did the only thing i have done this month without deliberating first. forwarded both pages, with r&g's engagement letter — the one with no requesting director on it — to cornelius and to the chair of the audit committee, from my own account, at ten past eleven at night, subject line *strategic review — for the file*. whatever review was being written about me, the first question it gets asked now is who commissioned the reviewers.\n+\n+**11-11** — came home on the 19:40, alone, told nobody. r&g still booked to 11-20.\n+\n+what i felt was not shock. it was the flat relief of being handed proof of a thing i had stopped needing proof of.", "kind": "added", "chars": 1453, "id": "11-13/6", "ord": 6, "week": "11-13", "squares": 7}, {"note": "rosencrantz-guildenstern-review.md", "head": "@@ -13,3 +13,9 @@ # rosencrantz & guildenstern — \"strategic review\"", "add": 6, "dele": 0, "text": " **11-03** — r asked me at the coffee point how the film was coming and whether there was archive in it. i said there was a lot of archive in it. he said \"anything interesting\" in the voice of a man reading the second line of a script.\n \n **11-05** — after the film, in the corridor, g said mum wanted to see me, and then \"we just want to understand whats wrong, as friends.\" i took the ring off and handed it to him and asked him to tell me how i slept last night. he turned it over twice. \"it doesnt work like that.\" no. and yet you think you can get it out of me with a lanyard and a lunch.\n+\n+**11-09** — same flight, same hotel, booked by the same assistant on the same reference. neither of them mentioned it until we were at the gate.\n+\n+**11-11** — came back on the 19:40 without telling them. their booking runs to 11-20. they are still down there, being paid to be down there, which means somebody wanted me down there until 11-20.\n+\n+**11-12** — cornelius: the audit chair has suspended the strategic review \"pending clarification of its commissioning\", and their lanyards went off at noon. they are still in lisbon, booked to 11-20, and they found out from the hotel wifi. i sent the pages. i do not feel about it what i expected to feel, which is anything. [[lisbon-booking-voltemand-file]]", "kind": "added", "chars": 698, "id": "11-13/7", "ord": 7, "week": "11-13", "squares": 3}, {"note": "ophelia-contact-log.md", "head": "@@ -1,6 +1,6 @@", "add": 1, "dele": 1, "text": " # ophelia — contact log\n \n-started this six weeks ago because i kept losing track of what i had actually said to her and what i had only drafted. that should have told me something.\n+started this six weeks ago because i kept losing track of what i had actually said to her and what i had only drafted. that should have told me something and it did not.\n \n **10-22** — she walked me to the bike after work. laertes flew back to lisbon this afternoon, and before he went he told her to be careful with me: that i am not free to mean what i say, because of whose son i am in that building, and she should not read too much into any of it. she laughed telling me. i did not, and she noticed that i did not, and then i did not tell her about the forty seconds, which is the first thing i have ever decided not to tell her.", "kind": "mixed", "chars": 323, "id": "11-13/8", "ord": 8, "week": "11-13", "squares": 2}, {"note": "ophelia-contact-log.md", "head": "@@ -22,3 +22,17 @@ # ophelia — contact log", "add": 14, "dele": 0, "text": " **11-05** — did not call her from the corridor on nine. i had my phone in my hand for a different reason.\n \n **11-06** — her father. i have not called her. i cannot work out whether calling would be for her.\n+\n+**11-10** — marcellus, by text, 22:10, while i was in lisbon: she was on nine after hours on monday, laying flowers along the stair rail where her father went over, one stem at every upright, and singing something, not loudly. rosemary, he thinks, and something purple. francisco walked her down to a taxi. i read it in a hotel room and did not call. [[marcellus-shift-logs]]\n+\n+**11-12** —\n+\n+the times i could have called and did not:\n+- 10-28, after ursa\n+- 10-31\n+- 11-05, from the corridor, phone already in my hand\n+- 11-09, from the airport\n+- 11-10, from the hotel, after marcellus's text\n+- 11-11, from the 19:40\n+\n+that is the list. that is all this file is now.", "kind": "added", "chars": 648, "id": "11-13/9", "ord": 9, "week": "11-13", "squares": 3}, {"note": "anniversary-film-fen-co.md", "head": "@@ -25,3 +25,9 @@ # anniversary film — fen & co", "add": 6, "dele": 0, "text": " cut locked 16:12 monday. claudius moved the screening forward to the offsite on **thursday 11-05**, ninth floor, 16:40, because \"the board are all in the room anyway.\"\n \n he moved it forward himself. i want that written down somewhere that is not my memory.\n+\n+**11-10** — the screening happened and then everything else happened and nobody has said a word about the film since.\n+\n+tobias emailed from lisbon time, which means he does not know: \"great room on thursday, everyone very moved, can we talk about the public cut.\" i have not replied.\n+\n+the public cut was meant to go out on the anniversary. the anniversary is wednesday. no one has mentioned it. [[claudius-chief-executive]]", "kind": "added", "chars": 418, "id": "11-13/10", "ord": 10, "week": "11-13", "squares": 2}, {"note": "horatio-what-we-know.md", "head": "@@ -17,7 +17,9 @@ # horatio — what we know", "add": 3, "dele": 1, "text": " \n told h after he hung up: if i start behaving oddly in the building over the next weeks it is on purpose, and he is not to ask me about it in front of anyone. he said \"how will i tell the difference\". i said he would not need to.\n \n-**agreed 10-22**: we say nothing to anyone, including ophelia, until we know who the shoulder belongs to. h's condition, not mine. i agreed to it in the flat at about one in the morning and i have kept it, which surprises me.\n+**agreed 10-22**: we say nothing to anyone, including ophelia, until we know who the shoulder belongs to. h's condition, not mine.\n+\n+i kept that agreement for twenty-two days and then put it in a film, which is not what either of us meant by *say nothing*, and h has not once said so.\n \n **know** (added 10-27)\n - rosencrantz asked h whether i was sleeping, within four hours of me being difficult on purpose", "kind": "mixed", "chars": 506, "id": "11-13/11", "ord": 11, "week": "11-13", "squares": 3}, {"note": "horatio-what-we-know.md", "head": "@@ -32,3 +34,13 @@ # horatio — what we know", "add": 10, "dele": 0, "text": " asked h on wednesday to watch claudius during the film and not the screen, and to tell me what he saw before i told him what i saw. he had the glass at the same second i did.\n \n h came to the flat at eleven on friday night without being asked. did not ask me what happened in mum's office. made tea and sat there. i told him about the file going to tobias and he said \"i wish youd told me on 10-29\", and i said i know, and that was the whole of the argument we were both expecting to have.\n+\n+**know** (added 11-13)\n+- voltemand's instructions in the lisbon file name me in the second paragraph\n+- laertes has been in claudius's office twice since thursday\n+- osric asked me to a bout on tuesday on laertes's behalf\n+- the strategic review is suspended pending clarification of who commissioned it, 11-12. i sent the pages that got it suspended\n+\n+h is the only person i have told about the message. he did not tell me not to go. what he said was \"then take your own bottle and let me come and watch\", which is horatio in one line. he is coming on tuesday — ursa at six, then the hall, and he will stand by the wall looking like he would rather be anywhere else.\n+\n+he has all of this file now, the footage timestamps, and cornelius's number. i told him that on thursday, in case. he said \"dont\", and then, after a while, \"all right\".", "kind": "added", "chars": 825, "id": "11-13/12", "ord": 12, "week": "11-13", "squares": 4}, {"note": "inquest-bundle-gaps.md", "head": "@@ -6,6 +6,16 @@ # inquest bundle — gaps", "add": 11, "dele": 1, "text": " \n **in it**: admission record · pathology summary · marcellus's initial statement · bernardo's follow-up · francisco's handover log from 18:00 · one still frame from the roof camera, timestamped 02:11 · the duty roster for that night\n \n-**not in it**: the forty seconds either side of the still · the panel access log for the roof hatch · any statement from anybody in the building above the sixth floor · the maintenance record for the lock installed five months before\n+**not in it**: the forty seconds either side of the still · the panel access log for the roof hatch (expires twenty-four months after that night) · any statement from anybody in the building above the sixth floor · the maintenance record for the lock installed five months before\n \n **11-04** — checked the index against the finding. the finding says \"no evidence of the presence of any other person\". that is true of the bundle. it is not true of the night. those are different sentences and only one of them was read out.\n+\n+**11-11** — the review is listed for 11-26. four gaps and fourteen days.\n+\n+order to ask for them in, because cornelius says asking for everything at once is how you get nothing:\n+1. the panel access log — it expires twenty-four months after that night and nothing else does\n+2. the forty seconds — marcellus, if he will say he has it\n+3. the lock maintenance record\n+4. statements above the sixth\n+\n+number 2 is the one i cannot control and it is also the only one that shows a person. [[roof-footage-0211]]", "kind": "mixed", "chars": 1004, "id": "11-13/13", "ord": 13, "week": "11-13", "squares": 5}, {"note": "marcellus-shift-logs.md", "head": "@@ -10,7 +10,7 @@ # marcellus — shift logs", "add": 1, "dele": 1, "text": " - 02:14 marcellus at the ninth floor landing, nothing noted\n - 03:02 the alarm, external\n \n-bernardo at 02:07 on floor 8 means bernardo had four minutes to get to the roof and be a shoulder in a frame. marcellus does not think it is him and marcellus is the one who reads people for a living.\n+bernardo at 02:07 on floor 8 means bernardo had four minutes to get to the roof and be a shoulder in a frame. marcellus does not think it is him. after this week i am inclined to agree with him and for a worse reason: bernardo is being asked questions, not answering them.\n \n putting his phone away at ursa he said: \"something in that building has been wrong for a year, and everybody on nights knows it.\"", "kind": "mixed", "chars": 472, "id": "11-13/14", "ord": 14, "week": "11-13", "squares": 2}, {"note": "marcellus-shift-logs.md", "head": "@@ -19,3 +19,11 @@ # marcellus — shift logs", "add": 8, "dele": 0, "text": " horatio's line about it: \"people dont refuse work unless the work itself is wrong.\" which sounded better at the time than it does written down, but i have not been able to put it down either.\n \n **11-05** — francisco logged the alarm on nine at 18:05. that is the duty log, not my memory, and my memory is worth less than the duty log this week.\n+\n+**11-12** — he called at 22:47 thursday and would not say it on the phone. ursa friday 06:15 before he signed off.\n+\n+bernardo asked him about the footage on wednesday. marcellus said he didnt know what bernardo meant. bernardo did not believe him and marcellus knows bernardo knows.\n+\n+he is on thursday and friday this week and then bernardo takes the full rotation. that was always the plan. it does not feel like the plan this week.\n+\n+he asked who i might tell. i said horatio. he nodded like he had already had the conversation in his head and i had said the line he wrote for me.", "kind": "added", "chars": 574, "id": "11-13/15", "ord": 15, "week": "11-13", "squares": 3}, {"note": "osric-match-message.md", "head": "@@ -1 +1,15 @@", "add": 14, "dele": 0, "text": " # osric — the message\n+\n+**11-13 11:52**, voice message, transcribed here because i want the wording:\n+\n+> \"hi — so, laertes asked me to ask you, he wondered about tuesday, at the hall, seven? nothing formal, just a bout. he'll bring his own kit over from lisbon. and claudius says he'll come and watch, and bring something to toast whoever wins — he's put money on you, actually, ha. he said you'd know the time. let me know.\"\n+\n+*he said you'd know the time.* tuesday at seven is the time i have been there every tuesday since the funeral. nobody has to invent anything. you leave the ordinary thing exactly where it is and let a man walk into it.\n+\n+osric has never asked me anything on his own account in four years.\n+\n+claudius has put money on me. that is the strangest sentence in it, and osric laughed at it himself, on the recording, and did not think to edit it out.\n+\n+i said yes at 12:04. twelve minutes.\n+\n+i am writing down that i said yes and that i knew, so that i cannot come back to this page afterwards and pretend that i did not.", "kind": "added", "chars": 1000, "id": "11-13/16", "ord": 16, "week": "11-13", "squares": 5}, {"note": "wittenberg-withdrawal-form.md", "head": "@@ -6,6 +6,14 @@ # wittenberg — withdrawal form", "add": 8, "dele": 0, "text": " \n tuition refund goes to the estate account, which is still in dad's name, which means it becomes a probate question instead of a form. asked cornelius whether it has to.\n \n+two options and i keep pretending there are more:\n+- withdraw, and the year is over\n+- do nothing, and the year rolls, and the fee is 18,400\n+\n **10-29** — cornelius says the refund can come to me directly if i sign the release; it does not have to sit in the estate. he has already written to the registrar. one less thing in dad's name.\n \n so the paperwork problem is solved and the actual problem is untouched, which is about right for this month.\n+\n+**11-13** — 12-15. thirty-two days.\n+\n+horatio's postdoc is at wittenberg. he has not once asked me when i am coming back, and i have decided that is tact rather than an answer he already knows.", "kind": "added", "chars": 326, "id": "11-13/17", "ord": 17, "week": "11-13", "squares": 2}, {"note": "laertes-lisbon-office.md", "head": "@@ -3,3 +3,11 @@ # laertes — lisbon office", "add": 8, "dele": 0, "text": " runs the lisbon side. home twice a year. fenced at wittenberg, better than me, and knows it in the way that does not need saying.\n \n **10-21** — in town for the board week. at the ten o'clock in person, supplier contracts, addressed the whole thing to claudius and not to the room. the tone was different. i noticed the tone and then spent the rest of the meeting deciding whether i had invented the tone. flies back to lisbon thursday.\n+\n+**11-12** — back. flew in thursday morning, before.\n+\n+in claudius's office twice since. the second time the door was shut and osric was outside it doing nothing in a way that was obviously doing something.\n+\n+i am not angry at him. i would be him. if somebody had done to my father what i think was done to mine, and then done to my sister whatever it is that has been done, i would be exactly where laertes is standing, and i would be less careful about it than he is being.\n+\n+**11-13** — osric, on his behalf. tuesday, gothersgade, seven. \"a friendly bout, nothing formal.\" [[osric-match-message]]", "kind": "added", "chars": 589, "id": "11-13/18", "ord": 18, "week": "11-13", "squares": 3}, {"note": "who-asked-what-when.md", "head": "@@ -18,3 +18,9 @@ # who asked what, when", "add": 6, "dele": 0, "text": " | 11-04 | osric | tobias | the running order, four times |\n \n r asked it in the voice of a man reading the second line of a script.\n+\n+| 11-09 | claudius | — | sent me to lisbon for a fortnight |\n+| 11-11 | laertes | claudius | twice, door shut |\n+| 11-13 | osric | me | tuesday, on laertes's behalf |\n+\n+the last row is the first time in seven weeks that anybody has asked me anything directly, and it is an invitation to a fencing hall.", "kind": "added", "chars": 295, "id": "11-13/19", "ord": 19, "week": "11-13", "squares": 1}, {"note": "journal.md", "head": "@@ -1,4 +1,30 @@", "add": 26, "dele": 0, "text": " # journal\n+\n+**11-13** — osric left a voice message at 11:52. laertes proposes tuesday, gothersgade, seven. \"a friendly bout, nothing formal, he asked me to ask you.\" osric has never in his life asked me anything on his own account.\n+\n+i laughed out loud in the street outside ursa, properly, for the first time in weeks, because it is such a *transparent* piece of work. tuesday is a fencing night. it has always been a fencing night. that is what makes it workable — nobody has to invent anything, you just leave the ordinary thing where it is and let a man walk into it.\n+\n+i said yes. i am writing down that i said yes, and that i knew, so that i cannot come back to this page later and pretend i did not.\n+\n+i am not angry at laertes. i would be laertes. that is the whole trouble with this week.\n+\n+**11-12** — ophelia.\n+\n+there is nothing to write here yet. there is a list and the list is of the times i could have called and did not: 10-28, after ursa. 10-31. 11-05, from the corridor on nine, when i had my phone in my hand for a different reason. 11-09 from the airport. 11-10 from the hotel in lisbon, after marcellus's text. 11-11 from the train.\n+\n+they found her at the water below roskilde. mum was the one who rang to tell me, the first time she has rung since 11-05. nobody will say the obvious thing out loud and i am not going to be the first, which is its own kind of cowardice and i know it.\n+\n+**11-11** — came back on the 19:40, alone, did not tell anyone i was coming. rosencrantz and guildenstern are still down there with a hotel booked to 11-20.\n+\n+read the file twice on tuesday. the second time with the dates laid against the board minutes from the month he died and that is when you can see it: the decision existed before the meeting that made it. voltemand's instructions run to two pages and my name is in the second paragraph of both.\n+\n+the thing i felt was not shock. it was the flat relief of being handed proof of something i had stopped needing proof of.\n+\n+**11-10** — norvik's deal team in the hotel bar, a table of eight, loud and pleased with themselves. fortinbras's people. they closed two more of our suppliers today, and one of them is a warehouse in setúbal that has lost money every year for a decade — they bought it because it was there to be bought and we were not paying attention. eight grown people celebrating a warehouse, and i have had forty seconds and a standing order nobody can name for three weeks and made a film.\n+\n+from tonight either what i think is worth doing something about, or it is not worth thinking.\n+\n+**11-09** — lisbon. claudius booked a fortnight, put r&g on the same flight, and had it in my calendar before he mentioned it. the itinerary came from osric at 17:14 sunday.\n \n **11-06** — writing this at two in the morning on 11-06, so it is friday, so it has been about thirty hours.", "kind": "added", "chars": 2692, "id": "11-13/20", "ord": 20, "week": "11-13", "squares": 13}, {"note": "sleep-ring-score-log.md", "head": "@@ -19,11 +19,18 @@ # sleep ring score log", "add": 8, "dele": 1, "text": " | 11-04 | 7.41, latency 17 | the night before. lay there working out whether it is better to sit through ten more years of that building quietly, or to do the thing tomorrow and live with whatever comes after it. nobody who has done the second has told me how they slept |\n | 11-05 | 7.83, score 89 | the screening, mum's office, polonius. i was awake for all of it. |\n | 11-06 | 8.19, score 89 — best of the month | i wrote the journal entry at two in the morning |\n+| 11-08 | 9.19, rhr 42 | slept like something switched off. the day before lisbon |\n+| 11-10 | 6.74, latency 24, hrv 52 | read voltemand's file twice. the 24 minutes is the file |\n+| 11-11 | 6.04, score 79 — worst night of the run | the 19:40 home. did not call ophelia from the train |\n+| 11-12 | 6.94 | — |\n+| 11-13 | 6.84 | osric's message. laughed in the street. then this. |\n \n-the ring has said seven for three weeks. i have said four for three weeks. one of us is wrong and the ring is the one with the sensor.\n+the ring has said seven every week since i started wearing it. i have said four every week since i started wearing it. one of us is wrong and the ring is the one with the sensor.\n \n taking it off to see whether it resets is not a diagnostic procedure. stop doing it.\n \n it counts the hours. it does not count the dreams, which are the part that is wrong.\n \n 11-05 and 11-06 are the two best scores i have had since i started wearing this thing. that is not a comment on 11-05 and 11-06. whatever this measures, it does not measure that.\n+\n+seven weeks of this and the honest summary is: the ring is right about the hours and wrong about the night, and i have stopped expecting it to tell me anything i can use. bring the table to nyholm on 11-18 and let her have the argument with it instead of me.", "kind": "mixed", "chars": 941, "id": "11-13/21", "ord": 21, "week": "11-13", "squares": 5}, {"note": "dad-laptop-sigrid-boxes.md", "head": "@@ -9,3 +9,9 @@ # dad's laptop — sigrid's boxes", "add": 6, "dele": 0, "text": " **10-28** — asked her about the roof lock instead of about the boxes, which tells you something. she typed the covering note herself six months before he died; justification on the form was \"insurance\"; request came through polonius's office. nineteen years and she says nobody ever asked to lock that door before.\n \n she asked whether i had opened the box. i said not yet. she said \"theres no hurry, but there is a difference between not yet and no\", which is going to sit with me for a while.\n+\n+**11-13** — still by the window.\n+\n+she offered to courier the probate files she kept copies of. one line back: *yes please send them.* that is the whole of what i have to do and it has been on this list since 10-20.\n+\n+she should have a copy of the film when it is locked. she is most of it.", "kind": "added", "chars": 284, "id": "11-13/22", "ord": 22, "week": "11-13", "squares": 1}, {"note": "log.md", "head": "@@ -24,5 +24,12 @@ # log", "add": 8, "dele": 1, "text": " 11-02: 7.02h. gave tobias the file 09:50. cut locked 16:12.\n 11-03: 7.72h. nothing.\n 11-04: 7.41h, latency 17. read the running order four times.\n-11-05: 7.83h, score 89. offsite, nine. screening 16:40. claudius out at 16:47. mum's office 17:30. 18:05. did not eat after breakfast.\n+11-05: 7.83h, score 89. offsite, nine. screening 16:40. claudius out at 16:47. mum's office 17:30. the chair at 18:04. alarm logged 18:05. did not eat after breakfast.\n 11-06: 8.19h, score 89. best score of the month. wrote the journal at 02:00. cornelius 11:20. gertrude did not call.\n+11-07: 6.96h. roskilde, did not go in. drove back.\n+11-08: 9.19h, rhr 42. slept eleven hours in two pieces. itinerary from osric 17:14.\n+11-09: 7.26h. lisbon 09:15 out. r&g on the same booking.\n+11-10: 6.74h, latency 24, hrv 52. read voltemand's file twice. second time against the board minutes from the month he died. forwarded both pages and r&g's engagement letter to cornelius and the audit chair, 23:10. norvik in the hotel bar.\n+11-11: 6.04h, score 79. the 19:40 home, alone. did not call ophelia from the train.\n+11-12: 6.94h. ophelia. mum rang 16:20 to tell me, nine minutes. no other lines for this day.\n+11-13: 6.84h. osric voice message 11:52 — tuesday, gothersgade, seven. said yes. laughed in the street first. rang karin 14:10. the man who mows dad's plot rang 15:30.", "kind": "mixed", "chars": 1071, "id": "11-13/23", "ord": 23, "week": "11-13", "squares": 5}, {"note": "roof-footage-0211.md", "head": "@@ -14,7 +14,7 @@ # roof footage — 02:11", "add": 1, "dele": 1, "text": " \n thirteen seconds of a person who is not my father, on a roof he had no reason to be on, at an hour the door is locked from the inside.\n \n-marcellus pulled the file the week after and kept it because nobody asked him for it. he has the raw on a drive at his flat in bispebjerg. he offered me a copy on 10-21 and i said no, which i have thought about every day since.\n+marcellus pulled the file the week after and kept it because nobody asked him for it. he has the raw on a drive at his flat in bispebjerg. he offered me a copy on 10-21 and i said no. that was the single worst decision i have made this year and it took me three weeks to see it.\n \n **10-29** — tobias wants forty to sixty seconds of building archive under the middle section of the film. i have forty seconds of building archive.", "kind": "mixed", "chars": 505, "id": "11-13/24", "ord": 24, "week": "11-13", "squares": 3}, {"note": "roof-footage-0211.md", "head": "@@ -27,3 +27,9 @@ # roof footage — 02:11", "add": 6, "dele": 0, "text": " **11-05** — it played at 06:20 into the cut, so 16:46 by the clock. // Greenwich that formats as the day before. A synthetic week is mm-dd, a real one yyyy-mm-dd.
const MONTHS = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];

  const m = /^(?:[0-9]{4}-)?([0-9]{2})-([0-9]{2})$/.exec(iso ?? "");

// Beside its panel, a square at 0.83 of the size it had filling that room with three empty columns

  if (innerWidth < 960) return Math.max(300, Math.min(900, innerWidth - 32));
  const unit = 0.83 * (Math.min(900, basisWidth() - 392) - 64) / (weeks.length * (perRow + 3) - 3 + 0.8);
  return Math.min(innerWidth - 392,
                  Math.round(64 + unit * (weeks.length * (perRow + WEEK_GAP) - WEEK_GAP + 0.8)));
};
const svg = document.getElementById("waffle");
const detailEl = document.getElementById("detail");
const qEl = document.getElementById("q");
const countEl = document.getElementById("count");
const unitEl = document.getElementById("unit");
const chips = [...document.querySelectorAll("#views .chip")];
const NS = "http://www.w3.org/2000/svg";
const NUM = new Intl.NumberFormat("en-US");

function el(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
// textContent everywhere below: a note's name and a hunk's body are the user's own private
// prose, and prose is not markup.
function badge(text, cls) {
  const s = document.createElement("span");
  s.className = "badge " + (cls || "");
  s.textContent = text;
  return s;
}
// A tick in the characters view runs to tens of thousands, and the axis is a gutter wide.
const short = n => n >= 1e6 ? n / 1e6 + "M" : n >= 1e3 ? n / 1e3 + "k" : String(n);

// The two views. Everything about the chart is the same in both — the columns, the colours, the
// click, the filter — except what one square stands for. So that is all a view is: how many
// squares a hunk gets, what the axis counts, and how to say so out loud.
const VIEWS = {
  hunks: {
    squares: () => 1,
    order: hunks => hunks,
    axis: rows => String(rows * perRow),
    sub: w => w.hunks.length + " hunks",
    count: "one square is one hunk",
    label: "Hunks",
    unit: "One square is one hunk, so a fixed typo and a rewritten page are the same size. "
        + "Characters weighs them instead.",
  },
  chars: {
    squares: h => h.squares,
    // Biggest first, from the floor up — which puts the squares that stand for nothing, the
    // whole-content notes with no diff to measure, in a cap at the top of the column. The axis
    // then reads true against the coloured part of the column instead of through that padding.
    order: hunks => [...hunks].sort((a, b) => b.chars - a.chars),
    axis: rows => short(rows * perRow * charsPer),
    sub: w => NUM.format(w.hunks.reduce((n, h) => n + h.chars, 0)) + " chars",
    count: "one square is " + NUM.format(charsPer) + " characters",
    label: "Characters",
    unit: "One square is " + NUM.format(charsPer) + " characters added or removed — rounded, and "
        + "never below one, so the smallest edit still has a square to click. One hunk's squares "
        + "are fused into one piece and the gap is left to mean a boundary, so two big edits side "
        + "by side read as two shapes rather than one; the faint seams inside a piece are still "
        + "there to count. Biggest hunk at the floor. A whole-content note keeps its single "
        + "square here, since there is no diff under it to measure; those are the neutral ones "
        + "capping a column, above where the axis still counts.",
  },
};

let view = DATA.view;
let selected = null;   // the hunk being read on the right, not the square that was clicked
let pieces = [];

function draw() {
  const V = VIEWS[view];
  svg.textContent = "";
  pieces = [];

  // One entry per square, bottom-up in column order. A hunk appears as many times as it has
  // squares and it is the same object every time, which is what lets one click light them all.
  const columns = weeks.map(w => V.order(w.hunks).flatMap(h => Array(V.squares(h)).fill(h)));

  // Framed, a square's pitch is whatever fits the width over the connectome's x units — the
  // weeks' columns, WEEK_GAP between them and 0.4 of one either side, its xDomain exactly —
  // with its margins. On its own page the chart keeps the fixed cell it was given.
  const padL = 52, padR = 12, padT = 20, padB = 47;   // the y label above; day, date, tally below
  const units = weeks.length * (perRow + WEEK_GAP) - WEEK_GAP + 0.8;
  const pitch = embedded ? (chartWidth() - padL - padR) / units : cell + gap;
  cell = pitch - gap;
  const colW = perRow * pitch - gap;
  const colGap = embedded ? WEEK_GAP * pitch + gap : 34;
  const lead = embedded ? 0.4 * pitch : 0;
  const tallest = Math.max(1, ...columns.map(c => Math.ceil(c.length / perRow)));
  const plotH = tallest * pitch - gap;
  const baseY = padT + plotH;
  const width = embedded ? chartWidth() : padL + weeks.length * (colW + colGap) - colGap + 12;
  const height = baseY + padB + (embedded ? gap : 0);
  if (embedded) document.documentElement.style.setProperty("--chart-w", `${width}px`);

  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // A row is `perRow` squares, so a tick every whole number of rows is a round count of whatever
  // a square stands for. Every other row while the chart is short, and fewer once it is tall —
  // the characters view stacks several times the rows the hunks view does.
  const step = Math.max(2, Math.ceil(tallest / 10));
  for (let rows = 0; rows <= tallest; rows += step) {
    const y = baseY - rows * pitch;
    // Framed, a tick and no gridline or floor, as Plot draws the connectome's axis under it: six
    // pixels out from the plot's edge, the label three clear of it and centred on it.
    if (embedded)
      svg.appendChild(el("line", { x1: padL - 6, y1: y, x2: padL, y2: y,
                                   stroke: "var(--ink)", "stroke-width": 1 }));
    else
      svg.appendChild(el("line", { x1: padL - 8, y1: y, x2: width, y2: y,
                                   stroke: "var(--ink)", "stroke-width": rows ? 1 : 3,
                                   "stroke-opacity": rows ? 0.15 : 1 }));
    const t = el("text", { class: "axis", x: embedded ? padL - 9 : padL - 14,
                           y: y + (embedded ? 3.5 : 4), "text-anchor": "end" });
    t.textContent = V.axis(rows);
    svg.appendChild(t);
  }

  // What the axis counts, over its top-left corner with an arrow, the way Plot labels the
  // connectome's — so the one word changes with the toggle and nothing else does.
  // Clear of the top tick, whose label is centred on a gridline a gap above padT.
  const yLabel = el("text", { class: "axis ylabel", x: 4, y: padT - 12 });
  yLabel.textContent = "\u2191 " + V.label;
  svg.appendChild(yLabel);

  weeks.forEach((w, i) => {
    const x0 = padL + lead + i * (colW + colGap);
    // The day of the week above the date. A session folder named `11-13` has no year in it and
    // therefore no weekday anybody can derive, so the writer that dropped the year hands one
    // over in `microlite.md`'s own header and `_hunks` carries it here. The same size as the
    // date, so the two read as one label on two lines.
    // Framed, the two lines sit where Plot sets the connectome's tick label — a baseline 19.3px
    // under the floor, the next 1em below — and no tally under them.
    const line1 = embedded ? 19.3 : 16, line2 = embedded ? 30.3 : 30;
    if (w.weekday) {
      const day = el("text", { class: "axis week", x: x0 + colW / 2, y: baseY + line1,
                               "text-anchor": "middle" });
      day.textContent = w.weekday;
      svg.appendChild(day);
    }
    const label = el("text", { class: "axis week", x: x0 + colW / 2,
                               y: baseY + (w.weekday ? line2 : embedded ? line1 : 18),
                               "text-anchor": "middle" });
    label.textContent = pretty(w.week);
    svg.appendChild(label);
    if (!embedded) {
      const sub = el("text", { class: "axis", x: x0 + colW / 2, y: baseY + (w.weekday ? 43 : 31),
                               "text-anchor": "middle" });
      sub.textContent = V.sub(w);
      svg.appendChild(sub);
    }

    // Bottom-up, wrapping at perRow — the column is the quantity, the way a waffle reads. A
    // hunk's squares are consecutive in that order, which is what makes them a shape.
    let n = 0;
    for (const h of V.order(w.hunks)) {
      const g = piece(w, h, x0, n, n + V.squares(h) - 1, baseY, pitch);
      svg.appendChild(g);
      pieces.push({ g, hunk: h, note: h.note.toLowerCase() });
      n += V.squares(h);
    }
  });

  outline();
  dim();
  alignLegend();
}

// Framed, the legend's first swatch starts where the first column's first square does, as the
// connectome's does under it (align() there). Measured, so it holds if the chart scales down.
function alignLegend() {
  const legend = document.getElementById("legend"), swatch = legend.querySelector("i");
  if (!embedded || !swatch) return;
  legend.style.paddingLeft = "0px";
  const first = Math.min(...[...svg.querySelectorAll("rect.cell")].map(r => r.getBoundingClientRect().left));
  legend.style.paddingLeft = `${first - swatch.getBoundingClientRect().left}px`;
  // The controls over the chart span the chart itself, edge to edge, as the connectome's caption
  // does over its plot.
  const controls = qEl.closest(".controls");
  controls.style.paddingLeft = "0px";
  controls.style.width = "";
  const left = controls.getBoundingClientRect().left;
  controls.style.paddingLeft = `${svg.getBoundingClientRect().left - left}px`;
  controls.style.width = `${svg.getBoundingClientRect().right - left}px`;
  alignDetail();
}

// Framed, and while the panel sits beside the chart: the hunk's name and day level with the
// controls over the chart, middle to middle, and its box running from the top of the y axis to
// the foot of the legend, so the hunk is exactly as tall as the chart it came from. Measured from
// where each rests, every margin cleared first, so a second pass changes nothing. Stacked, the
// box keeps its square.
function alignDetail() {
  const end = detailEl.querySelector(".end");
  if (!embedded || !end) return;
  const who = end.querySelector(".who"), box = end.querySelector(".hunk");
  end.style.marginTop = box.style.marginTop = box.style.height = "";
  box.style.aspectRatio = box.style.boxSizing = "";
  if (detailEl.getBoundingClientRect().left < svg.getBoundingClientRect().right) return;
  const q = qEl.getBoundingClientRect(), wr = who.getBoundingClientRect();
  end.style.marginTop = `${parseFloat(getComputedStyle(end).marginTop)
                           + (q.top + q.bottom) / 2 - (wr.top + wr.bottom) / 2}px`;
  const top = svg.querySelector(".ylabel").getBoundingClientRect().top;
  const bottom = Math.max(...[...document.querySelectorAll("#legend > span")]
                               .map(s => s.getBoundingClientRect().bottom));
  box.style.marginTop = `${parseFloat(getComputedStyle(box).marginTop)
                           + top - box.getBoundingClientRect().top}px`;
  box.style.aspectRatio = "auto";
  box.style.boxSizing = "border-box";
  box.style.height = `${bottom - top}px`;
}

// One hunk, drawn as one thing. A square keeps its place on the pitch grid and simply grows into
// the gap on any side where the square next to it belongs to the same hunk — so the hunk tiles a
// single region, and the gap is left to mean the one thing the eye already reads it as: a
// boundary. Two large edits side by side used to be one undifferentiated block of colour.
//
// The outline is a path around that region rather than a border on each square, so it is the
// piece that thickens when selected. Inside it the seams stay, faintly: a waffle is a thing you
// count, and a hunk you cannot count the squares of is just a bar.
function piece(w, h, x0, first, last, baseY, pitch) {
  const g = el("g", { class: "piece" });
  const mine = n => n >= first && n <= last;
  const seam = [];

  for (let n = first; n <= last; n++) {
    const c = n % perRow, r = (n - c) / perRow;
    // Grid neighbours, not merely the next hunk-square along: a piece that wraps at the end of
    // a row is two blocks in the column, and drawing it as one would join them across the wrap.
    const left = c > 0 && mine(n - 1);
    const right = c < perRow - 1 && mine(n + 1);
    const down = mine(n - perRow);
    const up = mine(n + perRow);

    const x = x0 + c * pitch, top = baseY - r * pitch - cell;
    const x1 = x + cell + (right ? gap : 0);
    const y0 = top - (up ? gap : 0), y1 = top + cell;
    // The square and the gap to its right as one rect, the gap above it as another: the corner
    // those two gaps share is filled only when all four squares round it are this hunk's. One
    // rect up and right at once filled it with three, a tooth in the inner corner of an L.
    const upRight = c < perRow - 1 && mine(n + perRow + 1);
    const paint = { class: "cell", fill: kinds[h.kind].fill, "fill-opacity": kinds[h.kind].opacity };
    g.appendChild(el("rect", { ...paint, x, y: top, width: x1 - x, height: y1 - top }));
    if (up) g.appendChild(el("rect", { ...paint, x, y: y0, height: gap,
                                       width: cell + (right && upRight ? gap : 0) }));

    // Each internal boundary belongs to the square below it or to its left, so it is drawn once.
    if (right) seam.push(`M${x1} ${y0}V${y1}`);
    if (up) seam.push(`M${x} ${y0}H${x1}`);
  }

  if (seam.length) g.appendChild(el("path", { class: "seam", d: seam.join("") }));
  g.appendChild(el("path", { class: "edge",
                             d: outlinePath(first, last, x0, baseY, pitch, embedded ? gap / 2 : 0) }));
  const tip = el("title");
  tip.textContent = `${h.note}\n${h.kind} · +${h.add} −${h.dele}`
                  + (h.chars ? ` · ${NUM.format(h.chars)} chars` : "");
  g.appendChild(tip);
  g.onclick = () => show(w, h);
  return g;
}

// The outline of one piece, traced round the region its squares fill. The grid is taken at twice
// the square's resolution — each square, and each gap beside one — so a gap the piece's rects
// fill is inside it and a gap they leave is a notch, exactly as `piece` tiles them. Every side of
// that boundary moves out by `o`, and each end with it: out past a corner that turns away from the
// piece, back from one that turns into it, not at all where the side runs on into the next.
//
// On its own page `o` is 0 and this is the piece's own edge. Framed, it is half the gap, and
// stroked five wide with square caps it is the connectome's ring (OUTLINE_WIDTH in
// connection_waffle.py): a band centred in the gap around the hunk, so a picked hunk is outlined
// alike in both charts.
function outlinePath(first, last, x0, baseY, pitch, o) {
  const sq = (c, r) => c >= 0 && c < perRow && r >= 0
                       && r * perRow + c >= first && r * perRow + c <= last;
  // `>>` floors negatives too, so the slots off the left edge read as empty.
  const M = (i, j) => {
    const c = i >> 1, r = j >> 1;
    if (!(i & 1) && !(j & 1)) return sq(c, r);
    if (!(j & 1)) return sq(c, r) && sq(c + 1, r);     // the gap right of a square
    if (!(i & 1)) return sq(c, r) && sq(c, r + 1);     // the gap above one
    return sq(c, r) && sq(c + 1, r) && sq(c, r + 1) && sq(c + 1, r + 1);   // a corner, among four
  };
  const xs = i => x0 + (i >> 1) * pitch + (i & 1 ? cell : 0);
  const xe = i => i & 1 ? x0 + ((i >> 1) + 1) * pitch : xs(i) + cell;
  const yb = j => baseY - (j >> 1) * pitch - (j & 1 ? cell : 0);
  const yt = j => j & 1 ? baseY - ((j >> 1) + 1) * pitch : yb(j) - cell;
  const end = (along, diag) => !along ? o : diag ? -o : 0;
  const d = [];
  const r0 = Math.floor(first / perRow), r1 = Math.floor(last / perRow);
  for (let j = 2 * r0; j <= 2 * r1; j++) for (let i = 0; i < 2 * perRow - 1; i++) {
    if (!M(i, j)) continue;
    if (!M(i - 1, j)) d.push(`M${xs(i) - o} ${yt(j) - end(M(i, j + 1), M(i - 1, j + 1))}`
                           + `V${yb(j) + end(M(i, j - 1), M(i - 1, j - 1))}`);
    if (!M(i + 1, j)) d.push(`M${xe(i) + o} ${yt(j) - end(M(i, j + 1), M(i + 1, j + 1))}`
                           + `V${yb(j) + end(M(i, j - 1), M(i + 1, j - 1))}`);
    if (!M(i, j - 1)) d.push(`M${xs(i) - end(M(i - 1, j), M(i - 1, j - 1))} ${yb(j) + o}`
                           + `H${xe(i) + end(M(i + 1, j), M(i + 1, j - 1))}`);
    if (!M(i, j + 1)) d.push(`M${xs(i) - end(M(i - 1, j), M(i - 1, j + 1))} ${yt(j) - o}`
                           + `H${xe(i) + end(M(i + 1, j), M(i + 1, j + 1))}`);
  }
  return d.join("");
}

// What is selected is a hunk and not a square: in the characters view a hunk owns a block of
// them, and outlining one of that block would say the edit was smaller than it is.
function outline() {
  for (const p of pieces) p.g.classList.toggle("on", p.hunk === selected);
  // Last in the drawing, so its outline lies over the squares beside it, as the connectome's
  // ring lies over its neighbours.
  const on = pieces.find(p => p.hunk === selected);
  if (on) svg.appendChild(on.g);
}

function dim() {
  const q = qEl.value.trim().toLowerCase();
  for (const p of pieces) p.g.style.opacity = !q || p.note.includes(q) ? "" : "0.1";
}

function show(w, h) {
  selected = h;
  outline();
  detailEl.textContent = "";
  const box = hunkBox(h);
  // Framed, the hunk is drawn as the connectome's ends are, so a hunk opened in either chart of
  // the post looks the same: the caret, the note's name and its day in bold, the box open under
  // them. On its own page, the name as a title and the facts as badges.
  if (embedded) {
    // Never folded here — the hunk is the whole of what a click asks for — so no caret.
    const end = document.createElement("div");
    end.className = "end";
    const who = end.appendChild(document.createElement("span"));
    who.className = "who";
    for (const line of [h.note, [w.weekday, pretty(w.week)].filter(Boolean).join(" ")]) {
      who.appendChild(document.createElement("span")).textContent = line;
    }
    end.appendChild(box);
    detailEl.appendChild(end);
    alignDetail();
    return;
  }
  const title = document.createElement("h2");
  title.className = "title";
  title.textContent = h.note;
  detailEl.appendChild(title);
  const facts = document.createElement("div");
  facts.className = "facts";
  facts.appendChild(badge(w.week));
  facts.appendChild(badge(h.kind, h.kind));
  if (h.add || h.dele) facts.appendChild(badge(`+${h.add} −${h.dele}`));
  if (h.chars) facts.appendChild(badge(`${NUM.format(h.chars)} chars`));
  detailEl.appendChild(facts);
  detailEl.appendChild(box);
}

// The diff, one span per line, coloured by what the line did.
function hunkBox(h) {
  const box = document.createElement("div");
  box.className = "hunk";
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  code.className = "language-diff";
  for (const line of [h.head, ...(h.text ? h.text.split("\n") : [])]) {
    const span = document.createElement("span");
    span.className = line.startsWith("@@") ? "ln-h"
      : line.startsWith("+") ? "ln-a"
      : line.startsWith("-") ? "ln-d"
      : "ln-c";
    span.textContent = line || " ";
    code.appendChild(span);
  }
  pre.appendChild(code);
  box.appendChild(pre);
  return box;
}

for (const k in kinds) {
  const s = document.createElement("span");
  const i = document.createElement("i");
  i.style.background = kinds[k].fill;
  i.style.opacity = kinds[k].opacity;
  s.appendChild(i);
  // Framed, the name alone, as the connectome's legend under it has; the post says the rest.
  s.appendChild(document.createTextNode(embedded ? k : `${k} — ${kinds[k].note}`));
  document.getElementById("legend").appendChild(s);
}
alignLegend();

// Redrawing from scratch rather than resizing what is there: a hunk's squares are one, then
// several, so there is nothing to animate between and the chart is a few dozen rects anyway.
// The selection survives because it is the hunk, and the filter because it re-reads the box.
function setView(next) {
  view = next;
  for (const b of chips) b.setAttribute("aria-pressed", String(b.dataset.view === view));
  countEl.textContent = VIEWS[view].count;
  unitEl.textContent = VIEWS[view].unit;
  draw();
}
for (const b of chips) b.onclick = () => setView(b.dataset.view);
setView(view);
// A frame is as wide as the post makes it, so a resize can move the chart's width.
let drawnAt = chartWidth(), resizing;
if (embedded) addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { if (chartWidth() !== drawnAt) { drawnAt = chartWidth(); draw(); } }, 150);
});

// One plain list per week, stacked, each under its date.
const notesEl = document.getElementById("notes");
for (const w of weeks) {
  const h = document.createElement("h3");
  h.textContent = w.week;
  notesEl.appendChild(h);
  const ul = document.createElement("ul");
  for (const note of w.notes) {
    const li = document.createElement("li");
    li.textContent = note;
    ul.appendChild(li);
  }
  notesEl.appendChild(ul);
}

// The box finishes a note's name as it is typed — the finished part selected, so the next
// keystroke replaces it — and Tab or Enter takes the rest. A deletion is never completed, or
// backspacing over a suggestion would put it straight back.
// The `/` shortcut is this page's own; framed in a post the key belongs to the post.
// Framed, the controls move over the chart (laid out by alignLegend and EXTRA_STYLE).
if (embedded) {
  qEl.placeholder = "Select one note to view its snapshots";
  svg.closest(".chart").before(qEl.closest(".controls"));
  alignLegend();
}
const noteNames = [...new Set(weeks.flatMap(w => w.hunks.map(h => h.note)))].sort();
qEl.addEventListener("input", ev => {
  const typed = qEl.value;
  if (typed && !ev.inputType?.startsWith("delete")) {
    const hit = noteNames.find(n => n.toLowerCase().startsWith(typed.toLowerCase()));
    if (hit && hit.length > typed.length) {
      qEl.value = typed + hit.slice(typed.length);
      qEl.setSelectionRange(typed.length, hit.length);
    }
  }
  dim();
});
qEl.addEventListener("keydown", ev => {
  if (ev.key !== "Tab" && ev.key !== "Enter") return;
  const pending = qEl.selectionStart < qEl.selectionEnd && qEl.selectionEnd === qEl.value.length;
  if (ev.key === "Enter" || pending) ev.preventDefault();
  if (pending) qEl.setSelectionRange(qEl.value.length, qEl.value.length);
  dim();
});
document.addEventListener("keydown", ev => {
  if (document.activeElement === qEl) return;
  if (ev.key === "/") { ev.preventDefault(); qEl.focus(); }
  if (ev.key === "v") setView(view === "hunks" ? "chars" : "hunks");
});
</script>
</body>
</html>
