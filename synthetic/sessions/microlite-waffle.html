<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hunks — obsidian, week by week</title>
<style>
  :root {
    /* Ink and paper are aliases onto the palette's own tokens, so switching palette moves
       the ground and the type along with the marks. The contrasts in series.css were
       measured against that ground; hues on somebody else's paper are an unchecked claim. */
    --ink: var(--text);
    --paper: var(--bg);
    --yellow: #ffe500;
    --cyan: #4de1ff;
    --pink: #ff6ec7;
    --lime: #b6ff3c;
    --orange: #ff8a3d;
    --shadow: 6px 6px 0 var(--ink);
    /* jaan.io's motion tokens, same names and same curve, so the pages move alike. */
    --dur-fast: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);

    --series-1: #a65c00;
    --series-2: #00779e;
    --series-3: #9864f7;
    --series-4: #b58700;
    --series-5: #009ba9;
    --series-6: #a80009;
    --series-7: #005a2f;
    --series-8: #6d31c3;
    --series-9: #8b0091;
    --series-link: #65006a;
    --series-rest: #b9b2a0;
    --bg: #fff9f0;
    --card: #f7efe4;
    --surface: #f1e8dd;
    --text: #39322c;
    --muted: #6c635b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1, h2, h3 { font-family: Helvetica, Arial, sans-serif; font-weight: 900; margin: 0; }
  header {
    border-bottom: 4px solid var(--ink); background: var(--yellow);
    padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
  }
  header h1 { font-size: 30px; letter-spacing: -1px; text-transform: uppercase; }
  header .meta { font-size: 13px; }
  .layout { display: grid; grid-template-columns: minmax(280px, 26%) minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* A grid item defaults to min-width:auto, so one long unbroken line — a URL in a
     note or a message — widens the column past the viewport. Let the column shrink. */
  .panel { background: var(--card); border: 4px solid var(--ink); box-shadow: var(--shadow); min-width: 0; }
  .panel > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    padding: 8px 12px; border-bottom: 4px solid var(--ink); background: var(--cyan);
  }
  .controls { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  input[type=search], select {
    font: inherit; padding: 8px 10px; border: 3px solid var(--ink);
    background: var(--paper); width: 100%;
  }
  input[type=search]:focus, select:focus { outline: 4px solid var(--pink); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
    border: 3px solid var(--ink); background: var(--card); text-transform: lowercase;
  }
  .chip[aria-pressed="true"] { background: var(--lime); box-shadow: 3px 3px 0 var(--ink); }

  /* Tall enough to use the window, and it scrolls past that. The gradients at the
     top and bottom edges signal there is more rather than letting a long list look
     truncated — they are `background-attachment: local`, so they only show on the
     side that actually has more content. */
  #names {
    max-height: 78vh; overflow-y: auto; border-top: 4px solid var(--ink);
    background:
      linear-gradient(var(--card) 30%, rgba(244,241,228,0)) top / 100% 24px no-repeat,
      linear-gradient(rgba(244,241,228,0), var(--paper) 70%) bottom / 100% 24px no-repeat;
    background-attachment: local, local;
  }
  .name-row {
    width: 100%; text-align: left; font: inherit; cursor: pointer; background: var(--card);
    border: 0; border-bottom: 2px solid var(--ink); padding: 8px 12px;
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  .name-row:hover { background: var(--yellow); }
  .name-row[aria-current="true"] { background: var(--pink); }
  .name-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 12px; border: 2px solid var(--ink); padding: 0 6px; background: var(--paper); }

  .detail { padding: 16px; }
  .detail h2.title { font-size: 32px; letter-spacing: -1px; word-break: break-word; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .badge { font-size: 12px; padding: 3px 8px; border: 3px solid var(--ink); background: var(--paper); }

  .hist { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin: 16px 0 6px; }
  .hist div { flex: 1; background: var(--ink); min-height: 2px; }
  .hist-axis { display: flex; justify-content: space-between; font-size: 11px; }

  .mention { border: 3px solid var(--ink); margin-top: 14px; background: var(--paper); }
  .mention .head {
    padding: 6px 10px; border-bottom: 3px solid var(--ink); background: var(--card);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px;
  }
  .mention .head .path { font-weight: 700; word-break: break-all; }
  .mention pre {
    margin: 0; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere;
    font: inherit; font-size: 13px; max-height: 320px; overflow-y: auto;
  }
  mark { background: var(--yellow); border: 2px solid var(--ink); padding: 0 2px; }
  .empty { padding: 40px 16px; text-align: center; font-size: 14px; }
  kbd { border: 2px solid var(--ink); padding: 0 4px; background: var(--paper); font-size: 12px; }

  .layout { grid-template-columns: minmax(320px, auto) minmax(0, 1fr); }
  /* The squares' colours by name, so a framed page can hand them to the host's palette (FRAMED
     in _page.py) — its first three series, in order — where the page on its own is lime, cyan
     and pink. */
  :root {
    --kind-added: var(--lime); --kind-mixed: var(--cyan); --kind-removed: var(--pink);
    --kind-full: var(--paper);
  }
  /* Framed, the squares are painted as the connectome's are — the palette's topic hues at half
     strength, no outline — but three slots along, so an added square is not read as the
     connectome's first topic. The whole-content square takes its neutral grey, since paper on
     paper with no outline would be no square at all. */
  :root.embedded {
    --kind-added: var(--series-4); --kind-mixed: var(--series-5); --kind-removed: var(--series-6);
    --kind-full: var(--series-rest);
  }
  .embedded rect.cell { fill-opacity: 0.5; }
  .embedded .legend i { opacity: 0.5 !important; }
  /* Framed, the legend is drawn as Plot draws the connectome's under it: bare 15px swatches, the
     name in the system face at 10px, capitalised, starting under the first square (alignLegend). */
  .embedded .legend { font: 10px system-ui, sans-serif; gap: 0 10px; min-height: 33px;
                      align-items: center; text-transform: capitalize; }
  .embedded .legend span { gap: 5.5px; }
  /* Framed, the controls sit over the chart on one line, the views and then the box taking the
     rest, from the first square to the chart's right edge (alignLegend); a phone wraps the box. */
  .embedded .controls { flex-direction: row; flex-wrap: wrap; align-items: stretch;
                        padding: 0 0 4px; box-sizing: border-box; }
  /* 12px, so the prompt it holds is whole beside the chips over a chart this narrow. */
  .embedded .controls input[type=search] { flex: 1 1 220px; min-width: 0; font-size: 12px; }
  /* The page's chips are lowercase by rule; in the post, capitalised like the legends. */
  .embedded .chip { text-transform: capitalize; }
  /* Framed, a hunk is drawn as the connectome's ends are (connection_waffle.py): the name and
     day in bold, the box under. Less the caret, since this one never folds; placed by
     alignDetail. */
  .embedded .end { margin-top: 18px; padding-top: 16px; }
  .embedded .end .who { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px;
                        overflow-wrap: anywhere; }
  .embedded .end .who > span { display: block; }
  /* And the axes in Plot's type, as the connectome's: 11px, regular, tabular figures. */
  .embedded .axis, .embedded .axis.week {
    font: 11px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  .embedded .legend i { width: 15px; height: 15px; border: 0; }
  /* The picked hunk's outline is the connectome's ring: five wide, in the gap (see outlinePath),
     square-capped so the separate sides close their corners as the ring's rect does. */
  .embedded .edge { stroke-width: 0; stroke-linecap: square; }
  /* No outline under the pointer: an outline means picked, as on the connectome's squares. */
  .embedded .piece:hover .edge { stroke-width: 0; }
  .embedded .piece.on .edge { stroke-width: 5; }
  .embedded .seam, .embedded #unit { display: none; }
  /* And the hunk panel is the note and its diff: no label over it, no badge row under the name. */
  .embedded .panel:has(#detail) > h2, .embedded #detail .facts { display: none; }
  /* Framed, the page is the chart and the note a click opens. The roll of every note touched is
     three screens of filenames under it, which in a post is a wall rather than a figure. */
  .embedded #notes-panel { display: none; }
  /* And the hunk sits beside the chart as soon as there is room for both. */
  /* The column is capped at the chart: left to `auto`, the legend's one long line took it wide
     and squeezed the hunk. A phone frame is narrower than the chart, which then scales down. */
  .embedded #waffle { max-width: 100%; height: auto; }
  @media (min-width: 960px) {
    .embedded .layout {
      grid-template-columns: calc(var(--chart-w, 550px) + 32px) minmax(340px, 1fr);
    }
  }
  @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .chart { padding: 16px; overflow-x: auto; }
  .chart svg { display: block; }
  .piece { cursor: pointer; }
  /* The squares of one hunk tile a single region, so their shared edges must land on the same
     pixel; without this a fused piece shows anti-aliased hairlines at fractional zoom. */
  .cell { shape-rendering: crispEdges; }
  .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; pointer-events: none; }
  .seam { fill: none; stroke: var(--ink); stroke-width: 1; stroke-opacity: 0.18;
          pointer-events: none; }
  .piece:hover .edge { stroke-width: 3; }
  .piece.on .edge { stroke-width: 4; }
  .axis { font: 11px ui-monospace, Menlo, monospace; fill: var(--ink); }
  .axis.week { font-size: 12px; font-weight: 700; }
  /* The week-by-week roll of what was touched, under the chart and across both columns. */
  #notes-panel { grid-column: 1 / -1; }
  .notes { padding: 4px 16px 16px; }
  .notes h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 3px solid var(--ink);
  }
  .notes h3:first-child { margin-top: 8px; }
  .notes ul { margin: 0; padding-left: 22px; }
  .notes li { padding: 1px 0; overflow-wrap: anywhere; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 14px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border: 2px solid var(--ink); display: block; }
  .unit { padding: 0 16px 14px; font-size: 12px; max-width: 80ch; }

  .badge.added { background: var(--lime); }
  .badge.mixed { background: var(--cyan); }
  .badge.removed { background: var(--pink); }
  .badge.full { background: var(--paper); }

  .hunk { border: 3px solid var(--ink); margin-top: 14px; background: var(--card); }
  .hunk pre {
    margin: 0; padding: 12px; max-height: 62vh; overflow: auto; background: var(--card);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .hunk code { display: block; white-space: pre; }
  .hunk code > span { display: block; padding: 0 6px; margin: 0 -6px; }
  .hunk .ln-h { color: #8250df; background: #f3eefd; font-weight: 700; }
  .hunk .ln-a { color: #116329; background: #e6ffec; }
  .hunk .ln-d { color: #a40e26; background: #ffebe9; }
  .hunk .ln-c { color: #57606a; }

 him.\n\n**10-21** — the film archive is mostly his material. every line of it sounds like a press release because every line of it was one.\n\nhe used to let me sit under the desk during the quarterly. i was seven. he did the voices.", "id": "10-24/4", "ord": 4, "week": "10-24", "squares": 1}, {"note": "ophelia-contact-log.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# ophelia — contact log\n\nstarted this six weeks ago because i kept losing track of what i had actually said to her and what i had only drafted. that should have told me something.\n\n**10-22** — she walked me to the bike after work. laertes flew back to lisbon this afternoon, and before he went he told her to be careful with me: that i am not free to mean what i say, because of whose son i am in that building, and she should not read too much into any of it. she laughed telling me. i did not, and she noticed that i did not, and then i did not tell her about the forty seconds, which is the first thing i have ever decided not to tell her.", "id": "10-24/5", "ord": 5, "week": "10-24", "squares": 1}, {"note": "polonius-chief-of-staff.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# polonius — chief of staff\n\ntalks for a living. has never once in four years given me a straight answer to a question i asked in a corridor.\n\n**10-22** — saw him walk laertes to the lift at three with a list. i caught the last three items going past: do not lend anybody at norvik anything, do not borrow from them either, and \"be true to yourself\", which from polonius is a fox recommending chickens. laertes nodded at every item like a man being read his own terms and conditions. flight at five.", "id": "10-24/6", "ord": 6, "week": "10-24", "squares": 1}, {"note": "kronborg-roof-access-codes.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# kronborg — roof access, codes\n\nthe hatch locks from the inside. key with the day shift. electronic lock added five months before he died.\n\nwho could open that door on 11-18:\n\n- francisco (day key)\n- bernardo (on shift)\n- marcellus (on shift)\n- facilities, whoever was carrying the master that month\n- anyone who was told the code and wrote it down\n\ncode changes monthly. last change before that night was 11-17. so the code was one day old, which is the safest a code ever is, which is the part that bothers me.\n\npolonius signed off the install. claudius was not chief executive yet but he was in the building most days. sigrid would know who asked for the lock and why — she was still in the office then. #access", "id": "10-24/7", "ord": 7, "week": "10-24", "squares": 1}, {"note": "marcellus-shift-logs.md", "head": "@@ -1,3 +1,15 @@", "add": 12, "dele": 0, "text": " # marcellus — shift logs\n \n rota, as of the new year. francisco days, hands to bernardo 18:00. bernardo to marcellus at midnight. marcellus to francisco at 06:00.\n+\n+**10-21** — asked him for the night of 11-18. he had it ready, which means he had had it ready for eleven months.\n+\n+- 23:58 marcellus signs on\n+- 02:07 bernardo logs the east stairwell, floor 8\n+- 02:11 roof door\n+- 02:14 marcellus at the ninth floor landing, nothing noted\n+- 03:02 the alarm, external\n+\n+bernardo at 02:07 on floor 8 means bernardo had four minutes to get to the roof and be a shoulder in a frame. marcellus does not think it is him and marcellus is the one who reads people for a living.\n+\n+putting his phone away at ursa he said: \"something in that building has been wrong for a year, and everybody on nights knows it.\"", "kind": "added", "chars": 620, "id": "10-24/8", "ord": 8, "week": "10-24", "squares": 3}, {"note": "mum-drafts-unsent.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# mum — drafts, unsent\n\nkeeping them here instead of in the messages app so that i stop nearly sending them at two in the morning.\n\n**draft, 10-20**\n> i know you think eleven months is long enough. it is not long enough. it is not a unit of anything.\n> the flowers from the funeral were still in the hall at roskilde when you got married. i know because i was the one who threw them out.\n\n**draft, 10-22**\n> did he ever tell you why the roof door got a lock on it five months before\n\nnot sent. neither of them. she said closure once on the phone on 10-08 and i have been drafting at her ever since.", "id": "10-24/9", "ord": 9, "week": "10-24", "squares": 1}, {"note": "nyholm-appointment.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# nyholm\n\ngp. first saw her three months ago about the sleep. she wrote things down and gave me a name i did not call.\n\n**10-23** — rang the surgery. next appointment is 11-18, 09:30. took it. 11-18.\n\ndid not say anything about that on the phone. the receptionist was reading from a screen.", "id": "10-24/10", "ord": 10, "week": "10-24", "squares": 1}, {"note": "claudius-chief-executive.md", "head": "@@ -1,3 +1,11 @@", "add": 8, "dele": 0, "text": " # claudius — chief executive\n \n appointed three weeks after. married mum three months later. the sequence is a fact and everyone treats saying it as an accusation.\n+\n+**10-19** — he makes decisions the way a man does when the decision was made before the meeting. i used to think that was competence. i have started timing it.\n+\n+the board minutes from the month he died are in the company drive and i have read the appointment item four times. the wording of the resolution is dated the 18th. the announcement went out on the 17th.\n+\n+**10-20** — in the lift, on the way up, he asked me to stay. \"dont go back to wittenberg. the company needs one of us in it who isnt me.\" mum rang an hour later and said the same sentence, word for word, *one of us in it*, which is how i know who wrote it.\n+\n+at the wedding in june he raised a glass to dad before he raised one to her, and everyone said how gracious. he toasts every occasion as though the occasion were his.", "kind": "added", "chars": 783, "id": "10-24/11", "ord": 11, "week": "10-24", "squares": 4}, {"note": "estate-account-probate.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# estate account / probate\n\nstill in dad's name. still paying things. cornelius says that is normal until probate closes and probate has not closed in eleven months.\n\n**10-19** — cornelius at 09:40. probate still open. \"not unusual at eleven months\" when there is a company holding in the estate.\n\nstanding orders still going out of it:\n1. house insurance, roskilde — 1,140 / quarter\n2. plot maintenance, roskilde churchyard — 380 / quarter\n3. something at 212 / month to a firm i do not recognise and neither does cornelius\n\nnumber 3 is the only interesting line in the whole account and i have asked about it twice.", "id": "10-24/12", "ord": 12, "week": "10-24", "squares": 1}, {"note": "wittenberg-withdrawal-form.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# wittenberg — withdrawal form\n\nnever formally withdrew. came back for the funeral and did not go back. the department has been patient in the way institutions are patient, which is to say by sending the same email four times.\n\n**10-23** — deadline to withdraw without a fee is **12-15**. after that the enrolment rolls and the fee rolls with it.\n\ntuition refund goes to the estate account, which is still in dad's name, which means it becomes a probate question instead of a form. asked cornelius whether it has to.\n\ntwo options and i keep pretending there are more:\n- withdraw, and the year is over\n- do nothing, and the year rolls, and the fee is 18,400", "id": "10-24/13", "ord": 13, "week": "10-24", "squares": 1}, {"note": "ines-abril-emails.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# ines abril — emails\n\nfreelance. has been writing about the company since before the inquest. six emails since the autumn, all of them polite, none of them answered.\n\n**10-22** — seventh email. pasted, because the wording matters:\n\n> Hello again — I'm told the anniversary film is going ahead for the anniversary itself. That's a natural moment for the piece I've been trying to write, and I'd rather write it with you than around you. No agenda, no ambush. — Ines\n\n\"than around you\" is the part that is doing the work.\n\nshe has been following up with marcellus and bernardo, which means she knows there is a roof in this, which means reynaldo has heard, which means polonius has.", "id": "10-24/14", "ord": 14, "week": "10-24", "squares": 1}, {"note": "laertes-lisbon-office.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# laertes — lisbon office\n\nruns the lisbon side. home twice a year. fenced at wittenberg, better than me, and knows it in the way that does not need saying.\n\n**10-21** — in town for the board week. at the ten o'clock in person, supplier contracts, addressed the whole thing to claudius and not to the room. the tone was different. i noticed the tone and then spent the rest of the meeting deciding whether i had invented the tone. flies back to lisbon thursday.", "id": "10-24/15", "ord": 15, "week": "10-24", "squares": 1}, {"note": "journal.md", "head": "@@ -1,4 +1,22 @@", "add": 18, "dele": 0, "text": " # journal\n+\n+**10-23** — claudius in the lift at nine, on my way out to bispebjerg, smiling the good smile, the one for the board. a man can smile at you every morning in a lift and still be the shoulder in the frame. i am writing that down because i want to remember it, and i am afraid that if i see the smile enough mornings i will stop being able to.\n+\n+remember. that is the whole of the instruction, and nobody gave it to me. it is just what forty seconds says if you watch it enough times.\n+\n+**10-22** — horatio watched it with me at the flat, twice, then a third time with the sound off because the sound is just wind. he did not say much. what he said was \"we should know who that is before we say anything to anyone\", and i agreed, and then we sat there for a while not saying anything to anyone. the second figure is at 02:11:18 and gone by 02:11:31. thirteen seconds. shoulder, part of an arm, then the frame is empty and it stays empty for the rest of it.\n+\n+i have watched it enough times now that i can tell you what the pigeons do.\n+\n+**10-21** — marcellus asked me to come to ursa before his shift ended. 06:20, he was already at the back table with his coat on. he put his phone on the table face up and said \"this is from that night\" and i said i know what it is and he said \"no you dont\". forty seconds. 02:11. i have seen the still the inquest used. i had not seen the forty seconds.\n+\n+he said he pulled it the week after and kept it because nobody asked him for it. that is the part i keep turning over. nobody asked him for it.\n+\n+am furious in a way that has nowhere to go and comes out as being late for things. was twenty minutes late to the eleven o'clock and could not have told you why.\n+\n+**10-20** — sigrid brought three boxes down from roskilde, left them in the hall, one marked *personal* in her handwriting which is her way of apologising. dad's laptop is in that one. i have not opened any of them. they are by the window.\n+\n+she stayed eleven minutes. asked how mum was. i said fine. she said \"and you\" and i said fine and she looked at me the way she used to look at dad when he said he would be home by seven.\n \n **10-14** — eleven months on friday. sigrid emailed to ask if i wanted dad's boxes before the house gets listed and i have not replied. the ring says i slept 7h. i was awake from three.", "kind": "added", "chars": 2105, "id": "10-24/16", "ord": 16, "week": "10-24", "squares": 11}, {"note": "bispebjerg-records-request.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# bispebjerg — records request\n\nwhat i actually want out of the file: witness statements, the coroner's working notes, the timeline as it was reconstructed, and whatever was submitted as access evidence.\n\nwhat i have: the finding, and one still frame.\n\n**10-23** — records office 10:15. they will not release to me direct even as next of kin while the estate is in probate. has to come through counsel, on the estate's letterhead, with the reference from the original file.\n\nreference is KB-4417/B. wrote it on my hand like a student.\n\nso: cornelius, not voltemand. voltemand has been to norvik three times since the new year and i would rather he did not know what i am asking for.", "id": "10-24/17", "ord": 17, "week": "10-24", "squares": 1}, {"note": "roof-footage-0211.md", "head": "@@ -3,3 +3,15 @@ # roof footage — 02:11", "add": 12, "dele": 0, "text": " what the inquest used: one still frame, timestamped 02:11, roof door open. that is the whole of what i have seen of it and it is the whole of what mum has seen of it.\n \n marcellus was on nights that week. francisco hands to bernardo at 18:00, bernardo to marcellus at midnight.\n+\n+**10-21** — marcellus has the forty seconds. not the still. the forty seconds either side of it.\n+\n+what is actually in it:\n+- 02:11:04 roof door opens inward. nobody in frame.\n+- 02:11:18 second figure enters lower left. shoulder, part of an upper arm, dark coat.\n+- 02:11:31 gone. out of frame, not through the door.\n+- 02:11:31 to 02:11:44 empty roof. pigeons on the plant housing.\n+\n+thirteen seconds of a person who is not my father, on a roof he had no reason to be on, at an hour the door is locked from the inside.\n+\n+marcellus pulled the file the week after and kept it because nobody asked him for it. he has the raw on a drive at his flat in bispebjerg. he offered me a copy on 10-21 and i said no, which i have thought about every day since.", "kind": "added", "chars": 733, "id": "10-24/18", "ord": 18, "week": "10-24", "squares": 4}, {"note": "fencing-gothersgade-tuesdays.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# fencing — gothersgade, tuesdays\n\nhall on gothersgade. tuesdays and thursdays, 19:00. 180 a session or 320 the month, which only makes sense if you go more than twice.\n\nstarted again after the funeral. the reason was that it was tuesday and i had to be somewhere that was not roskilde.\n\n**10-20** — tuesday. went. footwork for an hour, then bouts with karin, who does not ask questions and does not miss a parry. shoulder held.\n\nthis is the only hour in the week where i am not doing the other thing.", "id": "10-24/19", "ord": 19, "week": "10-24", "squares": 1}, {"note": "anniversary-film-fen-co.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# anniversary film — fen & co\n\nfor the anniversary. one year. claudius commissioned it three months ago and told me about it two months ago.\n\ntobias fen directing. sigrid's interviews are the spine of it, plus archive from the old comms library — yorick's era, mostly, which means it is going to sound like a press release with music under it.\n\n**10-22** — tobias wants twenty minutes with me on camera. have not replied. the film is about dad and the first twenty years and i am in it whether i plan to be or not, so i may as well choose what i say.\n\nscreening is set for 11-18 itself. company only, ninth floor.", "id": "10-24/20", "ord": 20, "week": "10-24", "squares": 1}, {"note": "dad-laptop-sigrid-boxes.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# dad's laptop — sigrid's boxes\n\nsigrid holt. nineteen years as his assistant, redundancy three weeks after. she packed his office herself and kept the laptop because \"it didnt feel like the rest\".\n\n**10-20** — three boxes, left in the hall, eleven minutes. one marked *personal* in her handwriting, which is how sigrid apologises.\n\nthe laptop is in that one. i have not opened the box, let alone the laptop. they are by the window and i walk past them about forty times a day.", "id": "10-24/21", "ord": 21, "week": "10-24", "squares": 1}, {"note": "sleep-ring-score-log.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# sleep ring score log\n\nstarted 10-01. horatio's idea — if im going to be certain im not sleeping i may as well be certain with a number.\n\nthe number and the night are not the same thing. writing both.\n\n| date | ring says | i say |\n|---|---|---|\n| 10-01 | 7.2 | fine |\n| 10-08 | 7.4 | four then awake |\n| 10-12 | 6.9 | four then awake |\n| 10-20 | 6.66, midsleep 03:38 | four then awake |\n| 10-21 | 6.93, latency 18 | maybe three. the night after the forty seconds |\n| 10-22 | 7.75 | horatio here till half one, so at least that is honest |\n| 10-23 | 7.00 | four then awake |\n\nthe ring has said seven for three weeks. i have said four for three weeks. one of us is wrong and the ring is the one with the sensor.", "id": "10-24/22", "ord": 22, "week": "10-24", "squares": 1}, {"note": "log.md", "head": "@@ -7,3 +7,10 @@ # log", "add": 7, "dele": 0, "text": " 10-08: 7.4h. tower all day. mum called, 4 min, said closure once.\n 10-12: 6.9h. awake 03:10–05:00. ursa 06:05. skipped dinner.\n 10-14: 7.0h. eleven months fri. did not reply to sigrid.\n+10-17: 7.95h, score 91. best in weeks. roskilde, one hour, left.\n+10-18: 8.85h, score 95. sunday. nothing.\n+10-19: 7.24h. cornelius 09:40, probate still open, \"not unusual at eleven months\".\n+10-20: 6.66h, midsleep 03:38. sigrid, three boxes, 11 min. did not open them.\n+10-21: 6.93h, latency 18, midsleep 04:44. marcellus at ursa 06:20. saw the forty seconds. late to the 11:00 by twenty min. ate nothing till nine pm.\n+10-22: 7.75h. horatio at the flat till half one. watched it 3x. marcellus rang at midnight, on speaker. laertes flew back to lisbon.\n+10-23: 7.00h. bispebjerg 10:15 — wont release to me direct, has to go via counsel. gothersgade cancelled, went home.", "kind": "added", "chars": 659, "id": "10-24/23", "ord": 23, "week": "10-24", "squares": 3}], "notes": ["fencing-kit-dad-jacket.md", "horatio-what-we-know.md", "nordhavn-lease-petra-lund.md", "roskilde-house-empty.md", "yorick-comms-quotes.md", "ophelia-contact-log.md", "polonius-chief-of-staff.md", "kronborg-roof-access-codes.md", "marcellus-shift-logs.md", "mum-drafts-unsent.md", "nyholm-appointment.md", "claudius-chief-executive.md", "estate-account-probate.md", "wittenberg-withdrawal-form.md", "ines-abril-emails.md", "laertes-lisbon-office.md", "journal.md", "bispebjerg-records-request.md", "roof-footage-0211.md", "fencing-gothersgade-tuesdays.md", "anniversary-film-fen-co.md", "dad-laptop-sigrid-boxes.md", "sleep-ring-score-log.md", "log.md"]}, {"week": "11-01", "weekday": "Sunday", "hunks": [{"note": "fencing-gothersgade-tuesdays.md", "head": "@@ -7,3 +7,7 @@ # fencing — gothersgade, tuesdays", "add": 4, "dele": 0, "text": " **10-20** — tuesday. went. footwork for an hour, then bouts with karin, who does not ask questions and does not miss a parry. shoulder held.\n \n this is the only hour in the week where i am not doing the other thing.\n+\n+**10-27** — went. fenced badly and on purpose, in the same way i was late on purpose, which i did not realise until karin said \"youre not here\" between bouts and i said no, fair.\n+\n+**10-29** — did not go. tobias at two, then stood in a corridor for four seconds and decided something, then went home.", "kind": "added", "chars": 297, "id": "11-01/0", "ord": 0, "week": "11-01", "squares": 1}, {"note": "log.md", "head": "@@ -9,8 +9,15 @@ # log", "add": 8, "dele": 1, "text": " 10-14: 7.0h. eleven months fri. did not reply to sigrid.\n 10-17: 7.95h, score 91. best in weeks. roskilde, one hour, left.\n 10-18: 8.85h, score 95. sunday. nothing.\n-10-19: 7.24h. cornelius 09:40, probate still open, \"not unusual at eleven months\".\n+10-19: 7.24h. cornelius 09:40, probate still open, \"not unusual at eleven months\". asked about the 212 standing order. second time.\n 10-20: 6.66h, midsleep 03:38. sigrid, three boxes, 11 min. did not open them.\n 10-21: 6.93h, latency 18, midsleep 04:44. marcellus at ursa 06:20. saw the forty seconds. late to the 11:00 by twenty min. ate nothing till nine pm.\n 10-22: 7.75h. horatio at the flat till half one. watched it 3x. marcellus rang at midnight, on speaker. laertes flew back to lisbon.\n 10-23: 7.00h. bispebjerg 10:15 — wont release to me direct, has to go via counsel. gothersgade cancelled, went home.\n+10-24: 6.71h. sat in the flat. did not open the boxes.\n+10-25: 6.61h, score 81. worst of the month. awake 02:40 on.\n+10-26: 7.22h. r&g in reception 08:40. lanyards already printed.\n+10-27: 7.59h. late on purpose to the 10:00. gothersgade 19:00, went, fenced badly.\n+10-28: 7.46h, latency 4. ursa 07:30 — said \"you never are\" to ophelia. paid for her coffee. worst thing i have said to anyone this year.\n+10-29: 6.85h. tobias 14:00, asked for archive. said yes. gothersgade 19:00, did not go.\n+10-30: 7.35h. petra: reynaldo has been asking her what hours i keep. claudius in the lift quoted my december message to ophelia.", "kind": "mixed", "chars": 822, "id": "11-01/1", "ord": 1, "week": "11-01", "squares": 4}, {"note": "roof-footage-0211.md", "head": "@@ -15,3 +15,9 @@ # roof footage — 02:11", "add": 6, "dele": 0, "text": " thirteen seconds of a person who is not my father, on a roof he had no reason to be on, at an hour the door is locked from the inside.\n \n marcellus pulled the file the week after and kept it because nobody asked him for it. he has the raw on a drive at his flat in bispebjerg. he offered me a copy on 10-21 and i said no, which i have thought about every day since.\n+\n+**10-29** — tobias wants forty to sixty seconds of building archive under the middle section of the film. i have forty seconds of building archive.\n+\n+not telling horatio until it is cut. he will say the right thing about it and i do not want to hear the right thing yet. #film\n+\n+**10-31** — a shoulder is not a face. i have built three weeks on thirteen seconds of somebody's coat, and a coat could be anybody's. before i do anything that cannot be undone i want better than the coat. i want to see his face when he sees it.", "kind": "added", "chars": 518, "id": "11-01/2", "ord": 2, "week": "11-01", "squares": 3}, {"note": "inquest-bundle-gaps.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# inquest bundle — gaps\n\nwhat the bundle contains against what should be in it. keeping this as two lists so i stop arguing with myself about it.\n\n**10-30** — cornelius sent the index on friday.\n\n**in it**: admission record · pathology summary · marcellus's initial statement · bernardo's follow-up · francisco's handover log from 18:00 · one still frame from the roof camera, timestamped 02:11 · the duty roster for that night\n\n**not in it**: the forty seconds either side of the still · the panel access log for the roof hatch · any statement from anybody in the building above the sixth floor · the maintenance record for the lock installed five months before", "id": "11-01/3", "ord": 3, "week": "11-01", "squares": 1}, {"note": "journal.md", "head": "@@ -1,4 +1,22 @@", "add": 18, "dele": 0, "text": " # journal\n+\n+**10-31** — saturday. had the phone in my hand to ring ophelia and put it down again.\n+\n+yesterday on tobias's monitor sigrid cried at the end of her interview, properly, for a man who signed her pay slips. i have not cried once. not at the funeral, not at the forty seconds. i said *coward* out loud in the flat this afternoon, to nobody, and it was embarrassing and it was also accurate. the film is either the answer to that or a more elaborate way of not doing anything, and from in here i genuinely cannot tell which.\n+\n+**10-29** — decided about the film today, in about four seconds, standing in the corridor on nine. tobias wants archive for the middle section. i have forty seconds of archive. i can put it in the cut and sit in the room and watch claudius watch it.\n+\n+felt something close to joy for about four hours. then felt like a coward for being that pleased with a plan that is still only a plan. i keep asking myself why i have not simply gone to the police with it, and the honest answer is that i do not have an answer i believe. the plan is better than the answer. that is the kind of sentence i would once have made fun of somebody for writing down.\n+\n+**10-28** — was cruel to ophelia at ursa and i am writing down exactly what i said because i want it on the record against me. she asked whether i was going to the offsite and i said \"you can tell your father i havent decided\". she said \"i wasnt asking for him\" and i said \"you never are\". then i left. i paid for her coffee on the way out, which is the most contemptible part of it.\n+\n+reynaldo has been asking about me in nordhavn. petra told me, not because she is on anyone's side but because she thought it was odd — a man asking the landlord what hours her tenant keeps.\n+\n+**10-27** — started being difficult on purpose to see who reports it. late to the ten o'clock, oblique in the eleven, cheerful at claudius in a way that is worse than rude. by four rosencrantz had asked horatio whether i was sleeping. so: eleven minutes and two floors, it turns out, is how long it takes.\n+\n+i am better at this than i expected and that bothers me.\n+\n+**10-26** — rosencrantz and guildenstern in reception at 08:40 with lanyards already printed. \"strategic review\". nobody commissioned a strategic review. guildenstern is always three steps behind and says the thing rosencrantz said, slower, as though he thought of it.\n \n **10-23** — claudius in the lift at nine, on my way out to bispebjerg, smiling the good smile, the one for the board. a man can smile at you every morning in a lift and still be the shoulder in the frame. i am writing that down because i want to remember it, and i am afraid that if i see the smile enough mornings i will stop being able to.", "kind": "added", "chars": 2361, "id": "11-01/4", "ord": 4, "week": "11-01", "squares": 12}, {"note": "dad-laptop-sigrid-boxes.md", "head": "@@ -4,4 +4,8 @@ # dad's laptop — sigrid's boxes", "add": 5, "dele": 1, "text": " \n **10-20** — three boxes, left in the hall, eleven minutes. one marked *personal* in her handwriting, which is how sigrid apologises.\n \n-the laptop is in that one. i have not opened the box, let alone the laptop. they are by the window and i walk past them about forty times a day.\n+the laptop is in that one. i have not opened the box, let alone the laptop. they are by the window. eight days now.\n+\n+**10-28** — asked her about the roof lock instead of about the boxes, which tells you something. she typed the covering note herself six months before he died; justification on the form was \"insurance\"; request came through polonius's office. nineteen years and she says nobody ever asked to lock that door before.\n+\n+she asked whether i had opened the box. i said not yet. she said \"theres no hurry, but there is a difference between not yet and no\", which is going to sit with me for a while.", "kind": "mixed", "chars": 749, "id": "11-01/5", "ord": 5, "week": "11-01", "squares": 4}, {"note": "ines-abril-emails.md", "head": "@@ -6,6 +6,10 @@ # ines abril — emails", "add": 5, "dele": 1, "text": " \n > Hello again — I'm told the anniversary film is going ahead for the anniversary itself. That's a natural moment for the piece I've been trying to write, and I'd rather write it with you than around you. No agenda, no ambush. — Ines\n \n-\"than around you\" is the part that is doing the work.\n+\"than around you\" is the part that is doing the work, and she knew it when she typed it.\n \n she has been following up with marcellus and bernardo, which means she knows there is a roof in this, which means reynaldo has heard, which means polonius has.\n+\n+**10-30** — three more, thursday and friday. guildenstern has talked to her; i can tell because two of her questions are phrased in his order.\n+\n+not answering. not because there is nothing there but because i am not the person who gets to tell it yet.", "kind": "mixed", "chars": 389, "id": "11-01/6", "ord": 6, "week": "11-01", "squares": 2}, {"note": "wittenberg-withdrawal-form.md", "head": "@@ -9,3 +9,9 @@ # wittenberg — withdrawal form", "add": 6, "dele": 0, "text": " two options and i keep pretending there are more:\n - withdraw, and the year is over\n - do nothing, and the year rolls, and the fee is 18,400\n+\n+still two options on 10-29. the paperwork around them has changed; they have not.\n+\n+**10-29** — cornelius says the refund can come to me directly if i sign the release; it does not have to sit in the estate. he has already written to the registrar. one less thing in dad's name.\n+\n+so the paperwork problem is solved and the actual problem is untouched, which is about right for this month.", "kind": "added", "chars": 383, "id": "11-01/7", "ord": 7, "week": "11-01", "squares": 2}, {"note": "polonius-chief-of-staff.md", "head": "@@ -3,3 +3,11 @@ # polonius — chief of staff", "add": 8, "dele": 0, "text": " talks for a living. has never once in four years given me a straight answer to a question i asked in a corridor.\n \n **10-22** — saw him walk laertes to the lift at three with a list. i caught the last three items going past: do not lend anybody at norvik anything, do not borrow from them either, and \"be true to yourself\", which from polonius is a fox recommending chickens. laertes nodded at every item like a man being read his own terms and conditions. flight at five.\n+\n+**10-28** — he has decided the problem is ophelia, and has told at least three people so, because reynaldo is asking my landlord what hours i keep and reynaldo only moves when polonius points him.\n+\n+the theory is tidy and it is wrong and it is easier than the true one, which is why it will win in that building.\n+\n+he sent accommodation and dietary requirements for an offsite that is in one room for one afternoon.\n+\n+**10-30** — he has a message i sent ophelia in december, and he has shown it to claudius. i know because claudius quoted it back to me in the lift this morning, smiling — \"doubt everything else, never doubt that\" — which i wrote at two in the morning and would not have shown my own mother. [[ophelia-contact-log]]", "kind": "added", "chars": 723, "id": "11-01/8", "ord": 8, "week": "11-01", "squares": 4}, {"note": "horatio-what-we-know.md", "head": "@@ -10,9 +10,16 @@ # horatio — what we know", "add": 7, "dele": 0, "text": " **think**\n - somebody did not want the forty seconds in the bundle\n - bernardo knows something he is not saying\n+- the lock, five months before, was not about insurance\n \n **sworn 10-22**: marcellus rang at midnight while h was here and asked us both, on speaker, to say we would not tell anyone where the file came from. he asked three times, which is a strange number for a security guard, and we said it three times.\n \n told h after he hung up: if i start behaving oddly in the building over the next weeks it is on purpose, and he is not to ask me about it in front of anyone. he said \"how will i tell the difference\". i said he would not need to.\n \n **agreed 10-22**: we say nothing to anyone, including ophelia, until we know who the shoulder belongs to. h's condition, not mine. i agreed to it in the flat at about one in the morning and i have kept it, which surprises me.\n+\n+**know** (added 10-27)\n+- rosencrantz asked h whether i was sleeping, within four hours of me being difficult on purpose\n+- r&g are engaged as \"strategic review\" with no requesting director on the paperwork\n+\n+h asked me on 10-27 what the plan actually was and i said i was finding out who reports what to whom. he said \"thats a method, not a plan.\" he was right and i said something unkind about postdocs.", "kind": "added", "chars": 453, "id": "11-01/9", "ord": 9, "week": "11-01", "squares": 2}, {"note": "estate-account-probate.md", "head": "@@ -9,4 +9,6 @@ # estate account / probate", "add": 3, "dele": 1, "text": " 2. plot maintenance, roskilde churchyard — 380 / quarter\n 3. something at 212 / month to a firm i do not recognise and neither does cornelius\n \n-number 3 is the only interesting line in the whole account and i have asked about it twice.\n+number 3 is the only interesting line in the whole account and i have now asked about it three times.\n+\n+**10-26** — asked cornelius again about the 212. he says he will pull the mandate. he has said that before. not his fault, it is voltemand's file and voltemand is the one who has to release it. #probate", "kind": "mixed", "chars": 394, "id": "11-01/10", "ord": 10, "week": "11-01", "squares": 2}, {"note": "anniversary-film-fen-co.md", "head": "@@ -7,3 +7,15 @@ # anniversary film — fen & co", "add": 12, "dele": 0, "text": " **10-22** — tobias wants twenty minutes with me on camera. have not replied. the film is about dad and the first twenty years and i am in it whether i plan to be or not, so i may as well choose what i say.\n \n screening is set for 11-18 itself. company only, ninth floor.\n+\n+**10-28** — crew in the building. three of them, small kit, tobias apologising to everyone in the lifts.\n+\n+**10-29** — tobias at 14:00 about the middle section. he wants forty to sixty seconds of building archive to run under sigrid's voiceover, \"something with the tower in it, doesnt need to be pretty, needs to be real.\"\n+\n+i said i would find him something.\n+\n+i said it and then i stood in the corridor on nine for about four seconds and understood what i had just agreed to do. #film\n+\n+**10-30** — watched sigrid's interview on tobias's monitor. four minutes about him, and at the end she cries, properly, on camera, for a man who signed her pay slips. i have not cried once. what is he to her, that she can do that in four minutes and i cannot do it in eleven months.\n+\n+tobias is cutting the middle from yorick's old tapes. there is one of yorick rehearsing dad's launch speech in dad's voice, and for about three seconds i thought it was dad. [[yorick-comms-quotes]]", "kind": "added", "chars": 957, "id": "11-01/11", "ord": 11, "week": "11-01", "squares": 5}, {"note": "ophelia-contact-log.md", "head": "@@ -3,3 +3,16 @@ # ophelia — contact log", "add": 13, "dele": 0, "text": " started this six weeks ago because i kept losing track of what i had actually said to her and what i had only drafted. that should have told me something.\n \n **10-22** — she walked me to the bike after work. laertes flew back to lisbon this afternoon, and before he went he told her to be careful with me: that i am not free to mean what i say, because of whose son i am in that building, and she should not read too much into any of it. she laughed telling me. i did not, and she noticed that i did not, and then i did not tell her about the forty seconds, which is the first thing i have ever decided not to tell her.\n+\n+**10-28** — ursa, about 07:30. verbatim, because i want it on the record against me:\n+\n+> her: are you coming to the offsite\n+> me: you can tell your father i havent decided\n+> her: i wasnt asking for him\n+> me: you never are\n+\n+then i left. i paid for her coffee on the way out, which is the worst part and i am not sure i can explain why.\n+\n+her father spent the week telling people the problem was her. i knew that when i said it. that is not a defence, it is the opposite of one.\n+\n+**10-30** — she texted at 23:40. her father asked her for the message i sent her in december and she gave it to him, because he asked, and she is sorry. so that is how claudius came to be quoting it at me in the lift this morning. i did not answer the text.", "kind": "added", "chars": 722, "id": "11-01/12", "ord": 12, "week": "11-01", "squares": 4}, {"note": "bispebjerg-records-request.md", "head": "@@ -9,3 +9,7 @@ # bispebjerg — records request", "add": 4, "dele": 0, "text": " reference is KB-4417/B. wrote it on my hand like a student.\n \n so: cornelius, not voltemand. voltemand has been to norvik three times since the new year and i would rather he did not know what i am asking for.\n+\n+**10-29** — sent cornelius the authorisation. he says two to four weeks, and that he needs exact dates and the reference, both of which i now have.\n+\n+he asked, carefully, whether there was a reason i wanted them now rather than in the spring. i said the anniversary film. he said \"ah\", which covered it and did not believe it.", "kind": "added", "chars": 323, "id": "11-01/13", "ord": 13, "week": "11-01", "squares": 2}, {"note": "who-asked-what-when.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# who asked what, when\n\nstarted 10-27. the method is: be difficult on purpose, then write down who hears about it and how fast.\n\n| when | who asked | who they asked | about |\n|---|---|---|---|\n| 10-27 12:10 | rosencrantz | horatio | whether i am sleeping |\n| 10-28 am | reynaldo | petra lund | what hours i keep, whether i have people over |\n| 10-29 | guildenstern | osric | whether i have seen the inquest papers |\n| 10-30 | polonius | ophelia | me |\n| 10-30 | claudius | me, in the lift | nothing. quoted my december message to ophelia back at me |\n\neleven minutes and two floors from being oblique in a meeting to rosencrantz asking horatio a question about my sleep.\n\nnobody has asked me anything.", "id": "11-01/14", "ord": 14, "week": "11-01", "squares": 1}, {"note": "sleep-ring-score-log.md", "head": "@@ -7,11 +7,17 @@ # sleep ring score log", "add": 7, "dele": 1, "text": " | date | ring says | i say |\n |---|---|---|\n | 10-01 | 7.2 | fine |\n-| 10-08 | 7.4 | four then awake |\n | 10-12 | 6.9 | four then awake |\n | 10-20 | 6.66, midsleep 03:38 | four then awake |\n | 10-21 | 6.93, latency 18 | maybe three. the night after the forty seconds |\n | 10-22 | 7.75 | horatio here till half one, so at least that is honest |\n | 10-23 | 7.00 | four then awake |\n+| 10-24 | 6.71 | four |\n+| 10-25 | 6.61, score 81 — worst of the month | four, and the worst of them |\n+| 10-28 | 7.46, latency 4 | went out like a light. the day i decided about the film |\n \n the ring has said seven for three weeks. i have said four for three weeks. one of us is wrong and the ring is the one with the sensor.\n+\n+taking it off to see whether it resets is not a diagnostic procedure. stop doing it.\n+\n+it counts the hours. it does not count the dreams, which are the part that is wrong.", "kind": "mixed", "chars": 386, "id": "11-01/15", "ord": 15, "week": "11-01", "squares": 2}, {"note": "marcellus-shift-logs.md", "head": "@@ -13,3 +13,7 @@ # marcellus — shift logs", "add": 4, "dele": 0, "text": " bernardo at 02:07 on floor 8 means bernardo had four minutes to get to the roof and be a shoulder in a frame. marcellus does not think it is him and marcellus is the one who reads people for a living.\n \n putting his phone away at ursa he said: \"something in that building has been wrong for a year, and everybody on nights knows it.\"\n+\n+**10-27** — bernardo will not go back up alone. marcellus asked him straight and got \"no\", and nothing after the no.\n+\n+horatio's line about it: \"people dont refuse work unless the work itself is wrong.\" which sounded better at the time than it does written down, but i have not been able to put it down either.", "kind": "added", "chars": 307, "id": "11-01/16", "ord": 16, "week": "11-01", "squares": 2}, {"note": "mum-drafts-unsent.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# mum — drafts, unsent\n\nkeeping them here instead of in the messages app so that i stop nearly sending them at two in the morning.\n\n**draft, 10-20**\n> i know you think eleven months is long enough. it is not long enough. it is not a unit of anything.\n> the flowers from the funeral were still in the hall at roskilde when you got married. i know because i was the one who threw them out.\n\n**draft, 10-22**\n> did he ever tell you why the roof door got a lock on it five months before\n\nnot sent. neither of them. she said closure once on the phone on 10-08 and i have been drafting at her ever since.\n\n**draft, 10-27**\n> i am not unwell. i am accurate. those look the same from where you are sitting and i can see that.\n\nnot sent.", "id": "11-01/17", "ord": 17, "week": "11-01", "squares": 1}, {"note": "kronborg-roof-access-codes.md", "head": "@@ -13,3 +13,7 @@ # kronborg — roof access, codes", "add": 4, "dele": 0, "text": " code changes monthly. last change before that night was 11-17. so the code was one day old, which is the safest a code ever is, which is the part that bothers me.\n \n polonius signed off the install. claudius was not chief executive yet but he was in the building most days. sigrid would know who asked for the lock and why — she was still in the office then. #access\n+\n+**10-28** — asked sigrid. she says the lock request came through polonius's office six months before he died and the justification on the form was \"insurance\". she typed the covering note herself. she does not remember anyone asking for the roof to be locked before that and she was there nineteen years.\n+\n+so: a door nobody used gets a lock five months before somebody goes off it.", "kind": "added", "chars": 379, "id": "11-01/18", "ord": 18, "week": "11-01", "squares": 2}, {"note": "voltemand-norvik-billing.md", "head": "@@ -1,3 +1,11 @@", "add": 8, "dele": 0, "text": " # voltemand — norvik, billing\n \n outside counsel. cornelius is in-house. when i was a child i thought they were the same firm.\n+\n+**10-28** — three trips to norvik since the new year: 09-30, 10-14, 10-28. osric says the car service booking did not come from corp dev either time. \"not us.\"\n+\n+asked voltemand directly on 10-29. 09-30 was \"a client meeting\", no further detail. 10-28 he deferred — \"depends on probate timing\", which is not an answer to a question about norvik.\n+\n+cornelius, when i mentioned it: \"hes not billing us for those days.\" which is the actual problem. #norvik\n+\n+**10-30** — voltemand reported back to the board on norvik. claudius sent him in january to get fortinbras to stop picking off our suppliers, and the news is that fortinbras will stand off, and would in return like \"data-room access for a possible partnership\". the board said yes in eleven minutes. nobody asked what a competitor wants with our supplier pricing.", "kind": "added", "chars": 810, "id": "11-01/19", "ord": 19, "week": "11-01", "squares": 4}, {"note": "rosencrantz-guildenstern-review.md", "head": "@@ -1 +1,11 @@", "add": 10, "dele": 0, "text": " # rosencrantz & guildenstern — \"strategic review\"\n+\n+**10-26** — reception at 08:40, lanyards already printed, which means somebody in facilities had their names last week.\n+\n+engagement is booked as \"strategic review\". no requesting director on the paperwork. osric says it went through the chief executive's office directly, and then said \"i shouldnt have said that\", which is the most useful thing osric has ever done.\n+\n+knew them at wittenberg. guildenstern is always three steps behind and repeats what rosencrantz said, slower, as though he has just thought of it.\n+\n+**10-27** — was oblique at them on purpose all morning. by four rosencrantz had asked horatio whether i was sleeping.\n+\n+**10-29** — lunch, their idea. r said the building has felt like a prison all week. i said then it is one. g said, a beat later, that it only feels that way because i want more than it. i said i could live in a cupboard and call it a kingdom, if it were not for the dreams. neither of them had a line for that.", "kind": "added", "chars": 937, "id": "11-01/20", "ord": 20, "week": "11-01", "squares": 5}, {"note": "offsite-running-order.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# offsite — running order\n\nninth floor, not the coast. claudius's version of a retreat is a room with the blinds down.\n\n**10-26** — polonius sent accommodation and dietary requirements at 18:47 for an event that is in one building and lasts one afternoon. i have not responded.\n\nosric is making a spreadsheet about it. osric is always making a spreadsheet about it.", "id": "11-01/21", "ord": 21, "week": "11-01", "squares": 1}, {"note": "nordhavn-lease-petra-lund.md", "head": "@@ -9,4 +9,10 @@ # nordhavn lease — petra lund", "add": 7, "dele": 1, "text": " reasons to stay: it is quiet, it is twenty minutes to the tower on the bike, and i can be in it without thinking about anybody.\n reasons to go: none that i can write down, which is not the same as none.\n \n-decide by 11-14.\n+decide by 11-14. twenty-six days.\n+\n+**10-30** — petra stopped me by the bins. a man came round on wednesday asking what hours i keep and whether i have people over. said he was \"doing a reference\". she told him to email the agency and then told me, because she thought it was odd, which it is.\n+\n+reynaldo does not do references. reynaldo does this. #reynaldo\n+\n+still have not answered her about the lease. sixteen days.", "kind": "mixed", "chars": 426, "id": "11-01/22", "ord": 22, "week": "11-01", "squares": 2}], "notes": ["fencing-gothersgade-tuesdays.md", "log.md", "roof-footage-0211.md", "inquest-bundle-gaps.md", "journal.md", "dad-laptop-sigrid-boxes.md", "ines-abril-emails.md", "wittenberg-withdrawal-form.md", "polonius-chief-of-staff.md", "horatio-what-we-know.md", "estate-account-probate.md", "anniversary-film-fen-co.md", "ophelia-contact-log.md", "bispebjerg-records-request.md", "who-asked-what-when.md", "sleep-ring-score-log.md", "marcellus-shift-logs.md", "mum-drafts-unsent.md", "kronborg-roof-access-codes.md", "voltemand-norvik-billing.md", "rosencrantz-guildenstern-review.md", "offsite-running-order.md", "nordhavn-lease-petra-lund.md"]}, {"week": "11-06", "weekday": "Friday", "hunks": [{"note": "wittenberg-withdrawal-form.md", "head": "@@ -6,12 +6,6 @@ # wittenberg — withdrawal form", "add": 0, "dele": 6, "text": " \n tuition refund goes to the estate account, which is still in dad's name, which means it becomes a probate question instead of a form. asked cornelius whether it has to.\n \n-two options and i keep pretending there are more:\n-- withdraw, and the year is over\n-- do nothing, and the year rolls, and the fee is 18,400\n-\n-still two options on 10-29. the paperwork around them has changed; they have not.\n-\n **10-29** — cornelius says the refund can come to me directly if i sign the release; it does not have to sit in the estate. he has already written to the registrar. one less thing in dad's name.\n \n so the paperwork problem is solved and the actual problem is untouched, which is about right for this month.", "kind": "removed", "chars": 217, "id": "11-06/0", "ord": 0, "week": "11-06", "squares": 1}, {"note": "offsite-running-order.md", "head": "@@ -5,3 +5,13 @@ # offsite — running order", "add": 10, "dele": 0, "text": " **10-26** — polonius sent accommodation and dietary requirements at 18:47 for an event that is in one building and lasts one afternoon. i have not responded.\n \n osric is making a spreadsheet about it. osric is always making a spreadsheet about it.\n+\n+**11-04** — final running order, from osric, 4th version:\n+\n+- 14:00 claudius, \"the road ahead\"\n+- 15:10 lisbon, laertes dialling in\n+- 16:00 break\n+- 16:40 the film\n+- 17:20 close, drinks on nine — claudius to raise a glass to \"the founder\"\n+\n+the film is at 16:40 and the archive section runs at 06:20 into it, so the forty seconds land at 16:46. i have read this running order four times and that is the only line in it i can see.", "kind": "added", "chars": 417, "id": "11-06/1", "ord": 1, "week": "11-06", "squares": 2}, {"note": "mum-drafts-unsent.md", "head": "@@ -2,16 +2,20 @@ # mum — drafts, unsent", "add": 9, "dele": 5, "text": " \n keeping them here instead of in the messages app so that i stop nearly sending them at two in the morning.\n \n-**draft, 10-20**\n-> i know you think eleven months is long enough. it is not long enough. it is not a unit of anything.\n-> the flowers from the funeral were still in the hall at roskilde when you got married. i know because i was the one who threw them out.\n-\n **draft, 10-22**\n > did he ever tell you why the roof door got a lock on it five months before\n \n-not sent. neither of them. she said closure once on the phone on 10-08 and i have been drafting at her ever since.\n+not sent. she said closure once on the phone on 10-08 and i have been drafting at her ever since.\n \n **draft, 10-27**\n > i am not unwell. i am accurate. those look the same from where you are sitting and i can see that.\n \n not sent.\n+\n+**11-05** — said it all out loud instead, in her office, at half five, and it came out worse than any of the drafts.\n+\n+what i actually said: \"you married the man who was on the roof.\"\n+\n+i cannot prove that. i should not have said it in that order. she said dad's name twice and i talked over her both times. then she said \"stop, you are making me look at things i cannot stop seeing\", and \"what do you want me to do\", and i said: not tonight. do not go home to him tonight. one night.\n+\n+then there was the chair in the next room, and neither of us has said anything to the other since.", "kind": "mixed", "chars": 1040, "id": "11-06/2", "ord": 2, "week": "11-06", "squares": 5}, {"note": "rosencrantz-guildenstern-review.md", "head": "@@ -9,3 +9,7 @@ # rosencrantz & guildenstern — \"strategic review\"", "add": 4, "dele": 0, "text": " **10-27** — was oblique at them on purpose all morning. by four rosencrantz had asked horatio whether i was sleeping.\n \n **10-29** — lunch, their idea. r said the building has felt like a prison all week. i said then it is one. g said, a beat later, that it only feels that way because i want more than it. i said i could live in a cupboard and call it a kingdom, if it were not for the dreams. neither of them had a line for that.\n+\n+**11-03** — r asked me at the coffee point how the film was coming and whether there was archive in it. i said there was a lot of archive in it. he said \"anything interesting\" in the voice of a man reading the second line of a script.\n+\n+**11-05** — after the film, in the corridor, g said mum wanted to see me, and then \"we just want to understand whats wrong, as friends.\" i took the ring off and handed it to him and asked him to tell me how i slept last night. he turned it over twice. \"it doesnt work like that.\" no. and yet you think you can get it out of me with a lanyard and a lunch.", "kind": "added", "chars": 588, "id": "11-06/3", "ord": 3, "week": "11-06", "squares": 3}, {"note": "sleep-ring-score-log.md", "head": "@@ -15,9 +15,15 @@ # sleep ring score log", "add": 6, "dele": 0, "text": " | 10-24 | 6.71 | four |\n | 10-25 | 6.61, score 81 — worst of the month | four, and the worst of them |\n | 10-28 | 7.46, latency 4 | went out like a light. the day i decided about the film |\n+| 11-02 | 7.02 | cut locked. fine. |\n+| 11-04 | 7.41, latency 17 | the night before. lay there working out whether it is better to sit through ten more years of that building quietly, or to do the thing tomorrow and live with whatever comes after it. nobody who has done the second has told me how they slept |\n+| 11-05 | 7.83, score 89 | the screening, mum's office, polonius. i was awake for all of it. |\n+| 11-06 | 8.19, score 89 — best of the month | i wrote the journal entry at two in the morning |\n \n the ring has said seven for three weeks. i have said four for three weeks. one of us is wrong and the ring is the one with the sensor.\n \n taking it off to see whether it resets is not a diagnostic procedure. stop doing it.\n \n it counts the hours. it does not count the dreams, which are the part that is wrong.\n+\n+11-05 and 11-06 are the two best scores i have had since i started wearing this thing. that is not a comment on 11-05 and 11-06. whatever this measures, it does not measure that.", "kind": "added", "chars": 676, "id": "11-06/4", "ord": 4, "week": "11-06", "squares": 3}, {"note": "kronborg-roof-access-codes.md", "head": "@@ -17,3 +17,7 @@ # kronborg — roof access, codes", "add": 4, "dele": 0, "text": " **10-28** — asked sigrid. she says the lock request came through polonius's office six months before he died and the justification on the form was \"insurance\". she typed the covering note herself. she does not remember anyone asking for the roof to be locked before that and she was there nineteen years.\n \n so: a door nobody used gets a lock five months before somebody goes off it.\n+\n+**11-04** — cornelius says the access log for 11-18 is not in the bundle. it was never requested, because the death was not treated as one where access mattered.\n+\n+it still exists. it is on the panel, not on paper, and the panel keeps twenty-four months. which gives me twenty-four months from that night and then it does not exist any more. [[inquest-bundle-gaps]]", "kind": "added", "chars": 362, "id": "11-06/5", "ord": 5, "week": "11-06", "squares": 2}, {"note": "horatio-what-we-know.md", "head": "@@ -8,9 +8,10 @@ # horatio — what we know", "add": 2, "dele": 1, "text": " - the inquest saw one still and not the forty seconds\n \n **think**\n-- somebody did not want the forty seconds in the bundle\n - bernardo knows something he is not saying\n - the lock, five months before, was not about insurance\n+\n+moved up from *think* to *know* on 11-04: the panel access log for the roof hatch was never requested for the bundle. that is not a theory now, cornelius checked the index.\n \n **sworn 10-22**: marcellus rang at midnight while h was here and asked us both, on speaker, to say we would not tell anyone where the file came from. he asked three times, which is a strange number for a security guard, and we said it three times.", "kind": "mixed", "chars": 227, "id": "11-06/6", "ord": 6, "week": "11-06", "squares": 1}, {"note": "horatio-what-we-know.md", "head": "@@ -23,3 +24,11 @@ # horatio — what we know", "add": 8, "dele": 0, "text": " - r&g are engaged as \"strategic review\" with no requesting director on the paperwork\n \n h asked me on 10-27 what the plan actually was and i said i was finding out who reports what to whom. he said \"thats a method, not a plan.\" he was right and i said something unkind about postdocs.\n+\n+**know** (added 11-06)\n+- claudius left the room at 16:47, ten seconds into the archive section\n+- polonius went over the ninth floor rail at 18:05\n+\n+asked h on wednesday to watch claudius during the film and not the screen, and to tell me what he saw before i told him what i saw. he had the glass at the same second i did.\n+\n+h came to the flat at eleven on friday night without being asked. did not ask me what happened in mum's office. made tea and sat there. i told him about the file going to tobias and he said \"i wish youd told me on 10-29\", and i said i know, and that was the whole of the argument we were both expecting to have.", "kind": "added", "chars": 628, "id": "11-06/7", "ord": 7, "week": "11-06", "squares": 3}, {"note": "polonius-chief-of-staff.md", "head": "@@ -6,8 +6,12 @@ # polonius — chief of staff", "add": 5, "dele": 1, "text": " \n **10-28** — he has decided the problem is ophelia, and has told at least three people so, because reynaldo is asking my landlord what hours i keep and reynaldo only moves when polonius points him.\n \n-the theory is tidy and it is wrong and it is easier than the true one, which is why it will win in that building.\n+the theory is tidy and it is wrong and it is easier than the true one, which is why it won.\n \n he sent accommodation and dietary requirements for an offsite that is in one room for one afternoon.\n \n **10-30** — he has a message i sent ophelia in december, and he has shown it to claudius. i know because claudius quoted it back to me in the lift this morning, smiling — \"doubt everything else, never doubt that\" — which i wrote at two in the morning and would not have shown my own mother. [[ophelia-contact-log]]\n+\n+**11-06** — the room next to mum's office has a door that does not shut properly. everyone on nine knows that. he knew it better than anyone; he is the one who had the lock on the roof hatch put in for \"insurance\".\n+\n+i heard the chair at 18:04. francisco logged the alarm at 18:05.", "kind": "mixed", "chars": 482, "id": "11-06/8", "ord": 8, "week": "11-06", "squares": 2}, {"note": "estate-account-probate.md", "head": "@@ -7,8 +7,12 @@ # estate account / probate", "add": 5, "dele": 1, "text": " standing orders still going out of it:\n 1. house insurance, roskilde — 1,140 / quarter\n 2. plot maintenance, roskilde churchyard — 380 / quarter\n-3. something at 212 / month to a firm i do not recognise and neither does cornelius\n+3. 212 / month, mandate set up four months before he died, payee on the mandate is an initialism and not a company\n \n number 3 is the only interesting line in the whole account and i have now asked about it three times.\n \n **10-26** — asked cornelius again about the 212. he says he will pull the mandate. he has said that before. not his fault, it is voltemand's file and voltemand is the one who has to release it. #probate\n+\n+**11-06** — cornelius at 11:20, mostly about thursday, but he brought the account up himself at the end which means it is bothering him too. the 212 mandate was set up four months before he died and the payee name on the mandate is an initialism, not a company.\n+\n+that is one month after the roof lock went in. i have written that sentence down and i am not going to do anything with it this week. [[kronborg-roof-access-codes]]", "kind": "mixed", "chars": 622, "id": "11-06/9", "ord": 9, "week": "11-06", "squares": 3}, {"note": "inquest-bundle-gaps.md", "head": "@@ -7,3 +7,5 @@ # inquest bundle — gaps", "add": 2, "dele": 0, "text": " **in it**: admission record · pathology summary · marcellus's initial statement · bernardo's follow-up · francisco's handover log from 18:00 · one still frame from the roof camera, timestamped 02:11 · the duty roster for that night\n \n **not in it**: the forty seconds either side of the still · the panel access log for the roof hatch · any statement from anybody in the building above the sixth floor · the maintenance record for the lock installed five months before\n+\n+**11-04** — checked the index against the finding. the finding says \"no evidence of the presence of any other person\". that is true of the bundle. it is not true of the night. those are different sentences and only one of them was read out.", "kind": "added", "chars": 240, "id": "11-06/10", "ord": 10, "week": "11-06", "squares": 1}, {"note": "roskilde-house-empty.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# roskilde — the house\n\nempty since the spring. sigrid kept the keys until she left and then handed them over like they might bite.\n\ncannot be in it for more than an hour. five attempts now and the longest was fifty minutes.\n\n**10-17** — an hour, then left. the fencing kit is in the upstairs hall closet. the plot at the churchyard is 380 a quarter out of the estate account and somebody mows it and i have never met them.", "id": "11-06/11", "ord": 11, "week": "11-06", "squares": 1}, {"note": "ophelia-contact-log.md", "head": "@@ -16,3 +16,9 @@ # ophelia — contact log", "add": 6, "dele": 0, "text": " her father spent the week telling people the problem was her. i knew that when i said it. that is not a defence, it is the opposite of one.\n \n **10-30** — she texted at 23:40. her father asked her for the message i sent her in december and she gave it to him, because he asked, and she is sorry. so that is how claudius came to be quoting it at me in the lift this morning. i did not answer the text.\n+\n+**11-04** — she came to my desk at ten with a paper bag: the book, the scarf, the two letters. \"you gave me these.\" her father and claudius were at the end of the corridor by the lifts, both looking at their phones, neither of them scrolling. i told her to go to lisbon. go to your brother, get out of this building, it will eat you. i said it louder than i needed to because i wanted the end of the corridor to hear it, and then i saw her face and understood that i had said it to her and not to them.\n+\n+**11-05** — did not call her from the corridor on nine. i had my phone in my hand for a different reason.\n+\n+**11-06** — her father. i have not called her. i cannot work out whether calling would be for her.", "kind": "added", "chars": 705, "id": "11-06/12", "ord": 12, "week": "11-06", "squares": 4}, {"note": "fencing-kit-dad-jacket.md", "head": "(current content — no diff)", "add": 0, "dele": 0, "chars": 0, "kind": "full", "text": "# kit — dad's jacket\n\nhis, from the storage unit at roskilde. he was 11 cm taller and broader across the chest, so the sleeves go past the heel of my hand and the shoulder sits wrong.\n\nit still smells like his office, which is a building he has not been in for eleven months and i have not been in for three.\n\n**10-20** — the mask is loose and the jacket is too big and the blade is the right weight, which is the only one of the three that matters and is also the only one i did not choose.\n\n**11-03** — took a hit on the left shoulder i should not have taken. the jacket moved and i did not. karin said \"youre wearing a tent\" and then did not make a joke out of it, which is why i like karin.\n\nthe hall rents a jacket for 40. i have not rented the jacket for 40.", "id": "11-06/13", "ord": 13, "week": "11-06", "squares": 1}, {"note": "marcellus-shift-logs.md", "head": "@@ -17,3 +17,5 @@ # marcellus — shift logs", "add": 2, "dele": 0, "text": " **10-27** — bernardo will not go back up alone. marcellus asked him straight and got \"no\", and nothing after the no.\n \n horatio's line about it: \"people dont refuse work unless the work itself is wrong.\" which sounded better at the time than it does written down, but i have not been able to put it down either.\n+\n+**11-05** — francisco logged the alarm on nine at 18:05. that is the duty log, not my memory, and my memory is worth less than the duty log this week.", "kind": "added", "chars": 150, "id": "11-06/14", "ord": 14, "week": "11-06", "squares": 1}, {"note": "claudius-chief-executive.md", "head": "@@ -9,3 +9,11 @@ # claudius — chief executive", "add": 8, "dele": 0, "text": " **10-20** — in the lift, on the way up, he asked me to stay. \"dont go back to wittenberg. the company needs one of us in it who isnt me.\" mum rang an hour later and said the same sentence, word for word, *one of us in it*, which is how i know who wrote it.\n \n at the wedding in june he raised a glass to dad before he raised one to her, and everyone said how gracious. he toasts every occasion as though the occasion were his.\n+\n+**11-02** — he moved the screening forward to the offsite himself. \"the board are all in the room anyway.\" nobody asked him to.\n+\n+**11-05** — nine seconds of the archive section and he put his glass down without looking for the table. out at 16:47 through the back with the lights still down. osric four seconds behind him.\n+\n+whatever i thought i was going to feel watching that, i felt nothing like it. i was calm.\n+\n+**11-05, 17:25** — on the way along to mum's office, past his. door open, lights off, him at the desk with his head in his hands and his phone face down. he did not look up. i could have gone in and said it to him there, alone, and i did not, because alone is exactly where he would want it said. i want it said somewhere it counts.", "kind": "added", "chars": 741, "id": "11-06/15", "ord": 15, "week": "11-06", "squares": 4}, {"note": "log.md", "head": "@@ -21,3 +21,8 @@ # log", "add": 5, "dele": 0, "text": " 10-28: 7.46h, latency 4. ursa 07:30 — said \"you never are\" to ophelia. paid for her coffee. worst thing i have said to anyone this year.\n 10-29: 6.85h. tobias 14:00, asked for archive. said yes. gothersgade 19:00, did not go.\n 10-30: 7.35h. petra: reynaldo has been asking her what hours i keep. claudius in the lift quoted my december message to ophelia.\n+11-02: 7.02h. gave tobias the file 09:50. cut locked 16:12.\n+11-03: 7.72h. nothing.\n+11-04: 7.41h, latency 17. read the running order four times.\n+11-05: 7.83h, score 89. offsite, nine. screening 16:40. claudius out at 16:47. mum's office 17:30. 18:05. did not eat after breakfast.\n+11-06: 8.19h, score 89. best score of the month. wrote the journal at 02:00. cornelius 11:20. gertrude did not call.", "kind": "added", "chars": 391, "id": "11-06/16", "ord": 16, "week": "11-06", "squares": 2}, {"note": "anniversary-film-fen-co.md", "head": "@@ -6,7 +6,7 @@ # anniversary film — fen & co", "add": 1, "dele": 1, "text": " \n **10-22** — tobias wants twenty minutes with me on camera. have not replied. the film is about dad and the first twenty years and i am in it whether i plan to be or not, so i may as well choose what i say.\n \n-screening is set for 11-18 itself. company only, ninth floor.\n+~~screening is set for 11-18 itself, company only, ninth floor~~ — moved. see 11-02.\n \n **10-28** — crew in the building. three of them, small kit, tobias apologising to everyone in the lifts.", "kind": "mixed", "chars": 145, "id": "11-06/17", "ord": 17, "week": "11-06", "squares": 1}, {"note": "anniversary-film-fen-co.md", "head": "@@ -19,3 +19,9 @@ # anniversary film — fen & co", "add": 6, "dele
